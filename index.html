async function scanPhoto(file){
  scanState.busy=true; scanState.err=''; renderPantry();
  try{
    const lim=sampleFn.limits?await sampleFn.limits():{images:true};
    if(lim&&lim.images===false) throw {message:'Photo reading isn\'t available here.'};
    const res=await sampleFn.json('You are looking at a photo of a home fridge, freezer or pantry. List every food or grocery item you can identify. Use short generic grocery names a shopper would use (e.g. "chicken breasts", "shredded cheddar", "marinara sauce", "eggs", "tortillas", "milk", "butter", "frozen green beans"). No brands, no quantities, no guesses about things you cannot see. Return JSON: {"items":["..."]}',{images:[file],modelTier:'default'});
    const items=(res&&Array.isArray(res.items))?res.items:Array.isArray(res)?res:[];
    scanState.found=[...new Set(items.map(s=>String(s).toLowerCase().trim()).filter(Boolean))];
    if(!scanState.found.length) scanState.err='Couldn\'t spot any food. Try a brighter, closer photo.';
  }catch(e){ scanState.err= e&&e.code==='not_granted'?'Allow Claude access to use photo scanning.': e&&e.code==='rate_limited'?'Too many scans right now. Try again in a minute.':'Couldn\'t read that photo. Try again.'; }
  scanState.busy=false; renderPantry();
}
async function askIdeas(){
  scanState.ideasBusy=true; scanState.ideas=''; renderPantry();
  try{
    const prompt=`I'm cooking for ${S.household} people including picky young kids. Here's what I have: ${S.pantry.join(', ')}. Suggest 3 easy dinners I could make tonight mostly from these (assume salt, pepper, oil, and basic spices). For each: a name line, then one or two short sentences on how to make it, then a tip for picky kids. Plain text, no markdown symbols.`;
    const out=await sampleFn(prompt,{modelTier:'quick',onText:({text})=>{scanState.ideas=text; const el=main.querySelector('.answer'); if(el) el.textContent=text; else if(tab==='pantry') renderPantry();}});
    scanState.ideas=out.text;
  }catch(e){ scanState.ideas= e&&e.code==='rate_limited'?'Too many requests right now. Try again in a minute.':'Couldn\'t get ideas right now.'; }
  scanState.ideasBusy=false; if(tab==='pantry') renderPantry();
}

function openImport(){
  openSheet('Paste your data','<p class="muted">Paste the code from “Copy my data”. This replaces the plan, pantry, favorites and recipes here.</p><label for="impT" style="position:absolute;left:-9999px">Data code</label><textarea id="impT" placeholder="PP1:…"></textarea><div class="row" style="margin-top:10px"><button class="btn primary" id="impGo">Replace with this data</button><span id="impMsg" class="miss"></span></div>');
  document.getElementById('impGo').onclick=()=>{ try{ const v=document.getElementById('impT').value.trim().replace(/^PP1:/,''); const o=JSON.parse(decodeURIComponent(escape(atob(v)))); if(!o||!o.plan) throw 0; S=Object.assign(fresh(),o); persist(); closeSheet(); render(); toast('Your data is here'); }catch(e){ document.getElementById('impMsg').textContent='That code didn’t work. Copy it again and paste the whole thing.'; } };
}
/* ---------- sheets ---------- */
const sheet=document.getElementById('sheet'), sheetBg=document.getElementById('sheetBg');
let lastFocus=null;
function openSheet(title,html){ lastFocus=document.activeElement; document.getElementById('shTitle').textContent=title; document.getElementById('shBody').innerHTML=html; document.getElementById('shBody').scrollTop=0; sheet.classList.add('open'); sheetBg.classList.add('open'); document.getElementById('shClose').focus(); }
function closeSheet(){ sheet.classList.remove('open'); sheetBg.classList.remove('open'); if(lastFocus&&lastFocus.focus) try{lastFocus.focus();}catch(e){} }
document.getElementById('shClose').onclick=closeSheet; sheetBg.onclick=closeSheet;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&sheet.classList.contains('open')) closeSheet(); });

function openRecipe(id,f){
  const r=byId(id); if(!r) return;
  let factor=f||(isDinner(r)?dinnerFactor(r):1);
  const draw=()=>{
    const ing=r.ingredients.map(x=>`<li class="${x.pantry?'pantry':''}"><span class="q">${esc(qtyStr(x.qty*factor<0.1?x.qty*factor:roundQty(x.qty*factor,COUNT_UNIT.test(x.unit)?'xx':x.unit),x.unit))}</span><span>${esc(x.item)}${pantryHas(x.key)?' <span class="chip">have</span>':''}</span></li>`).join('');
    const dayOpts=DAYS.map((d,i)=>`<option value="${i}">${DAYFULL[d]}${S.plan.days[i].id?' (replace)':''}</option>`).join('');
    const canShare = r.src==='mine' && db && userId;
    const h=`<div class="row" style="gap:6px;margin-bottom:6px"><span class="chip">${esc(r.category)}</span>${r.night?`<span class="chip m">${esc(r.night)}</span>`:''}${r.cook?`<span class="chip g">${esc(r.cook)}</span>`:''}${r.kid?'<span class="chip">kid pick</span>':''}</div>
      ${r.source?`<p class="muted" style="font-size:13px;margin:4px 0">From: ${esc(r.source)}</p>`:''}
      <div class="scale"><button class="iconbtn" id="dn" aria-label="Fewer servings">−</button><b id="sv">${servingsFor(r,factor)}</b><span>servings</span><button class="iconbtn" id="up" aria-label="More servings">+</button><span class="muted" style="font-size:13px">(recipe makes ${r.servings||4})</span></div>
      <h3>Ingredients</h3><ul class="ing">${ing}</ul>
      <h3>Steps</h3><ol class="steps">${(r.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
      ${r.notes?`<div class="note"><b>Tip:</b> ${esc(r.notes)}</div>`:''}
      <h3>Use it</h3><div class="stack">
        ${isDinner(r)?`<div class="row"><label for="toDay" class="muted" style="font-size:14px">Add to</label><select id="toDay" class="btn small" style="padding:6px 8px">${dayOpts}</select><button class="btn primary small" id="addDay">Add to week</button></div>`:''}
        ${r.category==='Prep Day'&&!S.plan.prep.includes(r.id)?`<button class="btn primary" id="addPrep">Add to prep day</button>`:''}
        ${r.category==='Breakfast'&&!S.plan.breakfast.includes(r.id)?`<button class="btn primary" id="addBkf">Add to this week's breakfasts</button>`:''}
        <div class="row"><button class="btn" id="fav">${S.favs[r.id]?'★ Saved to favorites':'☆ Save to favorites'}</button>${canShare?`<button class="btn" id="shareR">${r.shared?'Shared with friends':'Share with friends'}</button>`:''}${r.src==='mine'?`<button class="btn" id="delR">Delete</button>`:''}</div>
      </div>`;
    document.getElementById('shBody').innerHTML=h;
    const q=s=>document.getElementById(s);
    q('dn').onclick=()=>{ const step=1/(r.servings||4); factor=Math.max(step,factor-step); draw(); };
    q('up').onclick=()=>{ factor+=1/(r.servings||4); draw(); };
    if(q('addDay')) q('addDay').onclick=()=>{ const i=+q('toDay').value; const d=S.plan.days[i]; d.id=r.id; d.mult=Math.abs(factor-dinnerFactor(r,{}))<1e-6?null:factor; if(d.type==='Off') d.type=r.category==='Crockpot'?'Crockpot':'Easy'; autoExtras(); persist(); closeSheet(); render(); toast(`Added to ${DAYFULL[d.day]}`); };
    if(q('addPrep')) q('addPrep').onclick=()=>{ S.plan.prep.push(r.id); persist(); closeSheet(); render(); toast('Added to prep day'); };
    if(q('addBkf')) q('addBkf').onclick=()=>{ S.plan.breakfast.push(r.id); persist(); closeSheet(); render(); toast('Added to breakfasts'); };
    q('fav').onclick=()=>{ if(S.favs[r.id]) delete S.favs[r.id]; else S.favs[r.id]=true; persist(); draw(); render(); };
    if(q('shareR')) q('shareR').onclick=()=>shareRecipe(r,draw);
    if(q('delR')) q('delR').onclick=()=>{ if(q('delR').dataset.sure){ S.custom=S.custom.filter(x=>x.id!==r.id); S.plan.days.forEach(d=>{if(d.id===r.id)d.id=null;}); persist(); if(r.shared) syncShared(); closeSheet(); render(); toast('Recipe deleted'); } else { q('delR').dataset.sure='1'; q('delR').textContent='Tap again to delete'; } };
  };
  openSheet(r.name,''); draw();
}
function openPicker(i){
  const d=S.plan.days[i]; let q='';
  const draw=()=>{
    const list=allRecipes().filter(r=>isDinner(r)&&equipOK(r)).filter(r=>!q||(r.name+' '+r.tags.join(' ')).toLowerCase().includes(q.toLowerCase()));
    const cands=new Set(candidates(d.type).map(r=>r.id));
    list.sort((a,b)=>(cands.has(b.id)-cands.has(a.id))||((S.favs[b.id]?1:0)-(S.favs[a.id]?1:0))||a.name.localeCompare(b.name));
    document.getElementById('pickList').innerHTML=list.map(r=>`<button class="rc" data-choose="${esc(r.id)}" style="--c:${CAT_COLOR[r.category]||'var(--basil)'}"><span class="sw"></span><span><b>${S.favs[r.id]?'<span class="star">★</span> ':''}${esc(r.name)}</b><span class="meta"><span>${esc(r.category)}</span>${cands.has(r.id)?`<span class="chip m">fits ${esc(d.type)}</span>`:''}${r.kid?'<span class="chip">kid pick</span>':''}</span></span></button>`).join('');
    document.querySelectorAll('[data-choose]').forEach(b=>b.onclick=()=>{ d.id=b.dataset.choose; d.mult=null; if(d.type==='Off') d.type='Easy'; autoExtras(); persist(); closeSheet(); render(); });
  };
  openSheet(`Choose ${DAYFULL[d.day]}'s dinner`,`<input class="search" id="pq" type="search" placeholder="Search recipes" aria-label="Search recipes"><div class="row" style="margin-bottom:8px"><button class="btn small" id="offN">Make it a night off</button></div><div class="stack" id="pickList"></div>`);
  document.getElementById('pq').oninput=e=>{q=e.target.value; draw();};
  document.getElementById('offN').onclick=()=>{ d.type='Off'; d.id=null; autoExtras(); persist(); closeSheet(); render(); };
  draw();
}

/* ---------- add recipe ---------- */
function openAdd(){
  const ok=!!sampleFn;
  openSheet('Add a recipe',`<p class="muted">${ok?'Paste a recipe, a reel caption, or describe how you make it. Claude turns it into a recipe card.':'Adding recipes needs Claude. Open Pocket Pantry signed in to Claude to use this.'}</p>
  <label for="rtext" style="position:absolute;left:-9999px">Recipe text</label><textarea id="rtext" placeholder="e.g. Grandma's chicken spaghetti: 2 cans cream of chicken, rotel, velveeta…"></textarea>
  <div class="row" style="margin-top:10px"><label for="rcat2" class="muted" style="font-size:14px">Category</label><select id="rcat2" class="btn small">${['Auto'].concat(CAT_ORDER).map(c=>`<option>${c}</option>`).join('')}</select></div>
  <div class="row" style="margin-top:10px"><button class="btn primary" id="parse" ${ok?'':'disabled'}>Make recipe card</button><span id="pst" class="muted" style="font-size:14px"></span></div>`);
  const pb=document.getElementById('parse');
  pb.onclick=async()=>{
    const txt=document.getElementById('rtext').value.trim(); if(!txt){document.getElementById('pst').textContent='Paste a recipe first.';return;}
    pb.disabled=true; document.getElementById('pst').textContent='Writing your recipe card…';
    const cat=document.getElementById('rcat2').value;
    try{
      const out=await sampleFn.json(`Turn this into a structured family recipe. Fill in sensible quantities and steps if missing. Return ONLY JSON with this shape:
{"name":string,"category":one of ${JSON.stringify(CAT_ORDER)},"night":"Easy"|"Crockpot"|"Big Cook"|"Prep Day","servings":number,"cook":short time string,"tags":string[] (include "kid-friendly" if picky kids would likely eat it; "spicy" if spicy),"ingredients":[{"qty":number,"unit":string (lb, oz, cup, tbsp, tsp, cloves, slices, "can (15 oz)", "jar (24 oz)", "packet", "bag (12 oz)", or "" for counted items),"item":string,"section":one of ${JSON.stringify(SECTIONS)},"pantry":boolean (true for spices, oil, salt, condiments, flour, sugar, butter)}],"steps":string[],"notes":string (one tip for picky kids)}
${cat!=='Auto'?`Use category "${cat}".`:''}
Recipe:
${txt}`,{modelTier:'default'});
      if(!out||!out.name||!Array.isArray(out.ingredients)) throw new Error('bad');
      const r={id:'my-'+Date.now().toString(36),name:String(out.name),category:CAT_ORDER.includes(out.category)?out.category:'Weeknight',night:out.night||'Easy',servings:+out.servings||4,cook:out.cook||'',tags:Array.isArray(out.tags)?out.tags.map(String):[],
        ingredients:out.ingredients.map(i=>({qty:+i.qty||1,unit:String(i.unit||''),item:String(i.item||''),section:SECTIONS.includes(i.section)?i.section:'Other',pantry:!!i.pantry})),steps:Array.isArray(out.steps)?out.steps.map(String):[],notes:out.notes?String(out.notes):'',source:'Added by you'};
      S.custom.push(r); persist(); toast('Recipe added'); openRecipe(r.id);
    }catch(e){ document.getElementById('pst').textContent= e&&e.code==='rate_limited'?'Too many requests. Try again in a minute.':'Couldn\'t read that. Try adding more detail.'; pb.disabled=false; }
  };
}

/* ---------- friends' shared recipes ---------- */
async function syncShared(){
  if(!db||!userId) return;
  const mine=S.custom.filter(r=>r.shared).map(r=>{const c=Object.assign({},r); ['src','kid','shared'].forEach(k=>delete c[k]); c.ingredients=c.ingredients.map(i=>({qty:i.qty,unit:i.unit,item:i.item,section:i.section,pantry:!!i.pantry})); return c;});
  try{ await db.collection('shared').doc(userId).set({recipes:JSON.stringify(mine),t:Date.now()}); }catch(e){ toast('Couldn\'t share. Ask the owner for edit access.'); }
}
async function shareRecipe(r,redraw){ r.shared=!r.shared; const c=S.custom.find(x=>x.id===r.id); if(c) c.shared=r.shared; persist(); await syncShared(); toast(r.shared?'Shared with friends':'No longer shared'); redraw(); }
async function loadShared(){
  try{ const snap=await db.collection('shared').get(); const out=[];
    (snap.docs||snap||[]).forEach(d=>{ const id=d.id; if(id===userId) return; const data=typeof d.data==='function'?d.data():d; try{ JSON.parse(data.recipes||'[]').forEach(r=>{ r.id='f-'+id.slice(0,6)+'-'+r.id; r.source='Shared by a friend'; out.push(r); }); }catch(e){} });
    shared=out; render();
  }catch(e){}
}

/* ---------- boot ---------- */
if(!S.plan.days.some(d=>d.id)) autoPlan(); else render();
(async()=>{
  try{ if(!window.claude||!window.claude.use) return;
    const [d,u,s]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('sample')]);
    sampleFn=s||null; userNs=u||null;
    if(d&&u){ db=d; userId=await u.id(); }
    if(db&&userId){
      let loaded=false; const timer=setTimeout(()=>{ if(!loaded) setSync('Saved on this device'); },10000);
      try{ const doc=await db.collection('data/users/'+userId).doc('state').get(); loaded=true; clearTimeout(timer);
        const data=doc&&(typeof doc.data==='function'?doc.data():doc); const exists=doc&&(doc.exists===undefined?!!data:doc.exists);
        dbReady=true;
        if(exists&&data&&data.json){ S=Object.assign(fresh(),JSON.parse(data.json)); try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} }
        else { persist(); }
        setSync('Synced to your account');
      }catch(e){ clearTimeout(timer); }
      loadShared();
    }
    render();
  }catch(e){ render(); }
})();
})();
</script>
