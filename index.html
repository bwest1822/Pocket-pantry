<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Pantry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one-screen phone app, sticky header, scrolling panel, bottom tab bar */
  --bg:#f2f5f0; --surface:#ffffff; --ink:#1b2a22; --muted:#5f6f66; --line:#dfe6df;
  --basil:#2f7a4c; --basil-soft:#e2f0e6; --mustard:#d99a1e; --mustard-soft:#fbf0d6; --tomato:#c8462f; --tomato-soft:#f8e3de;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111813; --surface:#1a231d; --ink:#e8efe9; --muted:#9aab9f; --line:#2b372f;
  --basil:#6cc08b; --basil-soft:#1f3527; --mustard:#f0b94a; --mustard-soft:#3a2f17; --tomato:#ee7b63; --tomato-soft:#3d221d; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111813; --surface:#1a231d; --ink:#e8efe9; --muted:#9aab9f; --line:#2b372f;
  --basil:#6cc08b; --basil-soft:#1f3527; --mustard:#f0b94a; --mustard-soft:#3a2f17; --tomato:#ee7b63; --tomato-soft:#3d221d; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
header{padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;background:var(--bg);display:flex;align-items:center;gap:10px}
header h1{font:800 24px/1 var(--display);margin:0;letter-spacing:-.02em;flex:1}
header h1 span{color:var(--basil)}
.sync{font-size:12px;color:var(--muted)}
main{flex:1;overflow-y:auto;padding:0 16px 24px}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
nav.tabs button{background:none;border:0;padding:6px 0;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--basil);background:var(--basil-soft)}
h2{font:800 22px/1.15 var(--display);margin:8px 0 4px;text-wrap:balance;letter-spacing:-.01em}
h3{font:700 15px/1.3 var(--body);margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--muted);margin:0 0 12px;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:999px;font-weight:600;font-size:14px}
.btn.primary{background:var(--basil);border-color:var(--basil);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0e1a12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0e1a12}}
.btn.small{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stack{display:flex;flex-direction:column;gap:10px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--basil-soft);color:var(--basil);white-space:nowrap}
.chip.m{background:var(--mustard-soft);color:var(--mustard)}
.chip.t{background:var(--tomato-soft);color:var(--tomato)}
.chip.g{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
/* plan */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stat b{font:800 22px/1 var(--display);display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,var(--basil));border-radius:var(--radius);padding:10px 10px 10px 12px}
.day .dname{font:800 15px/1 var(--display)}
.day .dname small{display:block;font:600 10px/1.3 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.day .meal{font-weight:700;line-height:1.25;background:none;border:0;padding:0;text-align:left}
.day .meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.day select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 4px;font-size:12px;max-width:96px}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.settings label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.settings select,.settings input[type=number]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.tog[aria-pressed="true"]{background:var(--basil);border-color:var(--basil);color:#fff}
/* recipes */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;margin:6px 0 8px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.rgrid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.rgrid{grid-template-columns:1fr 1fr}}
.rc{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:left;width:100%}
.rc .sw{width:10px;align-self:stretch;border-radius:6px;background:var(--c,var(--basil));flex:none}
.rc b{display:block;line-height:1.25}
.rc .meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.star{color:var(--mustard)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,14,.45);display:none;z-index:20}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;background:var(--surface);border-radius:20px 20px 0 0;z-index:21;display:none;flex-direction:column;max-width:720px;margin:0 auto}
.sheet.open{display:flex}
.sheet .sh-head{padding:14px 16px 8px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line)}
.sheet .sh-head h2{flex:1;margin:0}
.sheet .sh-body{overflow-y:auto;padding:12px 16px calc(env(safe-area-inset-bottom) + 20px)}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ing li .q{min-width:92px;font-weight:700;font-variant-numeric:tabular-nums}
.ing li.pantry{color:var(--muted)}
ol.steps{padding-left:22px;margin:0}
ol.steps li{margin-bottom:10px}
.note{background:var(--mustard-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
.scale{display:flex;align-items:center;gap:8px;margin:6px 0 4px}
.scale b{font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
/* list */
.gsec{margin-top:14px}
.gsec h3{display:flex;justify-content:space-between;margin:0 0 6px}
.gitem{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
.gitem input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--basil)}
.gitem .nm{font-weight:600}
.gitem .uses{font-size:12px;color:var(--muted)}
.gitem .qty{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
.gitem.done .nm,.gitem.done .qty{text-decoration:line-through;color:var(--muted)}
.havebtn{border:0;background:none;color:var(--basil);font-size:12px;font-weight:700;padding:2px 0}
details.card summary{font-weight:700;cursor:pointer}
/* pantry */
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;border:2px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;background:var(--surface)}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 6px 5px 12px;font-size:14px}
.pchip button{border:0;background:var(--bg);border-radius:50%;width:22px;height:22px;line-height:1;padding:0;color:var(--muted)}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.miss{font-size:12px;color:var(--tomato)}
.answer{white-space:pre-wrap;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
textarea{width:100%;min-height:160px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

","night":"Crockpot"},{"id":"sausage-peppers","name":"Italian Sausage & Peppers","servings":5,"cook":"LOW 5-6 hr","tags":["pork","sandwiches","pasta"],"ingredients":[[1.5,"lb","raw Italian pork sausage links","Meat"],[3,"","bell peppers","Produce"],[1,"","large yellow onion","Produce"],[1,"jar (24 oz)","marinara sauce","Pasta & Sauce"],[2,"cloves","garlic","Produce"],[1,"tsp","Italian seasoning","Spices",1],[1,"tsp","olive oil","Baking",1],[5,"","hoagie rolls (or 1 lb pasta)","Bread & Grains"],[5,"slices","provolone","Dairy"]],"steps":["Brown sausage in oil in a skillet ~2 min per side.","Put sliced peppers and onion in slow cooker, sausage on top; add marinara, minced garlic and Italian seasoning.","Cook LOW 5-6 hr until peppers are tender and sausage is 160°F. Serve on hoagies or slice into sauce for pasta."],"notes":"Use mild sausage for the kids.","category":"Crockpot","source":"Samantha Jo Bowers reel (recreation)","prep":"10-15 min","night":"Crockpot"},{"id":"baked-chicken-tenders","name":"Baked Chicken Tenders, Potatoes & Green Beans","category":"Weeknight","night":"Easy","servings":4,"cook":"35 min","tags":["chicken","kid-friendly","oven"],"ingredients":[[1.5,"lb","chicken tenders","Meat"],[1,"","egg","Dairy"],[1,"cup","panko or crushed crackers","Baking"],[0.5,"tsp","garlic powder","Spices",1],[1,"lb","potatoes","Produce"],[1,"bag (12 oz)","frozen green beans","Frozen"]],"steps":["Heat oven to 425°F. Cut potatoes into small wedges, toss with oil and salt, roast 15 min.","Dip chicken in beaten egg, then in crumbs mixed with garlic powder. Bake on a separate pan 15-20 min until 165°F and potatoes are tender.","Steam the green beans."],"source":"Family rotation list"},{"id":"salsa-chicken-tacos","name":"Slow-Cooker Salsa Chicken Tacos","category":"Crockpot","night":"Crockpot","servings":4,"cook":"LOW 4-6 hr","tags":["chicken","tacos","kid-friendly","makes leftovers"],"ingredients":[[1.5,"lb","chicken breasts","Meat"],[1,"cup","mild salsa","International"],[1,"tbsp","taco seasoning","Spices",1],[8,"","small tortillas","Bread & Grains"],[1,"cup","shredded cheddar","Dairy"]],"steps":["Cook chicken, salsa and seasoning on LOW 4-6 hr, checking early for 165°F.","Shred chicken and stir back into sauce.","Serve in tortillas with cheese. Kids: chicken, cheese and tortilla separate on the plate."],"notes":"Double it (about 2½ lb chicken) to have 2 cups left for quesadillas or rice bowls the next night.","source":"Family rotation list"},{"id":"chicken-quesadillas","name":"Chicken Quesadillas & Black Beans","category":"Weeknight","night":"Easy","servings":4,"cook":"15 min","tags":["chicken","kid-friendly","uses leftovers"],"ingredients":[[2,"cup","cooked shredded chicken","Meat"],[4,"","large tortillas","Bread & Grains"],[1,"cup","shredded cheddar","Dairy"],[1,"can (15 oz)","black beans","Canned Goods"],[1,"cup","frozen corn","Frozen"]],"steps":["Fill tortillas with chicken and cheese, fold, and brown in a skillet over medium 2-3 min per side.","Warm drained beans and corn for a side.","Keep kids' plain; salsa at the table."],"source":"Family rotation list"},{"id":"chicken-broccoli-pasta","name":"Chicken & Broccoli Pasta","category":"Weeknight","night":"Easy","servings":4,"cook":"25 min","tags":["chicken","pasta","uses leftovers"],"ingredients":[[2,"cup","cooked diced chicken","Meat"],[8,"oz","short pasta","Pasta & Sauce"],[3,"cup","broccoli florets","Produce"],[1,"cup","milk","Dairy"],[1,"tbsp","butter","Dairy",1],[1,"tbsp","flour","Baking",1],[0.75,"cup","shredded cheddar","Dairy"]],"steps":["Cook pasta, adding broccoli for the last 3 min.","Melt butter, whisk in flour 1 min. Gradually whisk in milk and simmer until thick. Off heat, stir in cheddar.","Toss with pasta, broccoli and warmed chicken. Set plain pasta aside first for the kids if needed."],"source":"Family rotation list"},{"id":"chicken-fried-rice","name":"Chicken Fried Rice","category":"Weeknight","night":"Easy","servings":4,"cook":"20 min","tags":["chicken","rice","uses leftovers"],"ingredients":[[2,"cup","cooked diced chicken","Meat"],[3,"cup","cold cooked rice","Bread & Grains"],[2,"","eggs","Dairy"],[2,"cup","frozen peas and carrots","Frozen"],[2,"tbsp","low-sodium soy sauce","International",1],[0.5,"tsp","garlic powder","Spices",1]],"steps":["Scramble eggs in a large skillet; set aside.","Stir-fry vegetables in a little oil 3-4 min. Add rice, chicken and garlic powder; cook until hot.","Stir in eggs and soy sauce. Pull a kid portion before the soy if preferred."],"notes":"Best with day-old rice — cook extra rice earlier in the week.","source":"Family rotation list"},{"id":"taco-bowls","name":"Taco Bowls","category":"Weeknight","night":"Easy","servings":4,"cook":"25 min","tags":["beef","rice","kid-friendly","build-your-own"],"ingredients":[[1.25,"lb","lean ground beef or turkey","Meat"],[2,"tbsp","taco seasoning","Spices",1],[3,"cup","cooked rice","Bread & Grains"],[1,"can (15 oz)","black beans","Canned Goods"],[1,"cup","frozen corn","Frozen"],[0.75,"cup","shredded cheddar","Dairy"]],"steps":["Brown meat, stir in taco seasoning and ¼ cup water, simmer 3 min.","Warm drained beans and corn.","Serve over rice with cheddar. Kids build their own from small piles."],"source":"Family rotation list"},{"id":"spaghetti-meat-sauce","name":"Spaghetti with Meat Sauce","category":"Weeknight","night":"Easy","servings":4,"cook":"25 min","tags":["beef","pasta","kid-friendly"],"ingredients":[[1,"lb","lean ground beef or turkey","Meat"],[10,"oz","spaghetti","Pasta & Sauce"],[1,"jar (24 oz)","marinara sauce","Pasta & Sauce"],[0.5,"tsp","garlic powder","Spices",1],[0.25,"cup","grated Parmesan","Dairy"],[1,"bag (12 oz)","frozen green beans or salad","Frozen"]],"steps":["Brown meat with garlic powder.","Add marinara and simmer 10 min while pasta cooks.","Serve with Parmesan. Plain pasta + sauce on the side for kids if needed."],"source":"Family rotation list"},{"id":"meatballs-mash-peas","name":"Oven Meatballs, Mashed Potatoes & Peas","category":"Weeknight","night":"Big Cook","servings":4,"cook":"40 min","tags":["beef","kid-friendly","freezer-friendly"],"ingredients":[[1.25,"lb","lean ground beef or turkey","Meat"],[1,"","egg","Dairy"],[0.5,"cup","breadcrumbs","Baking"],[0.5,"cup","milk","Dairy"],[0.5,"tsp","garlic powder","Spices",1],[1.5,"lb","potatoes","Produce"],[2,"tbsp","butter","Dairy",1],[2,"cup","frozen peas","Frozen"]],"steps":["Mix meat, egg, breadcrumbs, ¼ cup milk and garlic powder. Roll ~16 meatballs; bake at 400°F 15-20 min (beef 160°F, turkey 165°F).","Boil diced potatoes until tender; mash with butter and a splash of milk.","Heat peas and serve."],"notes":"Double the meatballs and freeze half for a future spaghetti or meatball-sub night.","source":"Family rotation list"},{"id":"sloppy-joes","name":"Sloppy Joes & Potato Wedges","category":"Weeknight","night":"Easy","servings":4,"cook":"35 min","tags":["beef","sandwiches","kid-friendly"],"ingredients":[[1,"lb","lean ground beef or turkey","Meat"],[0.5,"cup","tomato sauce","Canned Goods"],[0.25,"cup","ketchup","Condiments",1],[1,"tsp","yellow mustard","Condiments",1],[1,"tsp","Worcestershire sauce","Condiments",1],[0.5,"tsp","garlic powder","Spices",1],[4,"","buns","Bread & Grains"],[1,"lb","potatoes","Produce"]],"steps":["Roast oiled potato wedges at 425°F 25-35 min, flipping halfway.","Brown meat, stir in tomato sauce, ketchup, mustard, Worcestershire and garlic powder; simmer 8-10 min.","Serve on buns, or filling next to a toasted bun for kids."],"source":"Family rotation list"},{"id":"cheeseburger-potatoes","name":"Cheeseburger Baked Potatoes","category":"Weeknight","night":"Easy","servings":4,"cook":"60 min (mostly oven)","tags":["beef","kid-friendly"],"ingredients":[[4,"","russet potatoes","Produce"],[1,"lb","lean ground beef or turkey","Meat"],[0.75,"cup","shredded cheddar","Dairy"],[0.5,"tsp","garlic powder","Spices",1],[1,"jar","dill pickles (optional)","Condiments",1],[1,"","mustard (optional)","Condiments",1]],"steps":["Scrub and pierce potatoes; bake at 425°F 45-60 min until soft.","Brown meat with garlic powder.","Split potatoes, top with meat and cheese. Pickles and mustard at the table."],"notes":"Shortcut: microwave potatoes 8-10 min, then 10 min in the oven to crisp.","source":"Family rotation list"},{"id":"sheet-pan-sausage","name":"Sheet-Pan Sausage, Potatoes & Green Beans","category":"Sheet Pan","night":"Easy","servings":4,"cook":"35 min","tags":["sausage","one-pan","kid-friendly"],"ingredients":[[14,"oz","fully cooked chicken sausage","Meat"],[1.25,"lb","potatoes","Produce"],[12,"oz","green beans","Frozen"],[0.5,"tsp","garlic powder","Spices",1],[0.5,"tsp","paprika","Spices",1]],"steps":["Cut potatoes bite-size, toss with oil and seasonings, roast at 425°F 20 min.","Add sliced sausage and green beans tossed with a little oil.","Roast 12-15 min more until potatoes are tender and sausage is hot."],"source":"Family rotation list"},{"id":"breakfast-tacos","name":"Breakfast-for-Dinner Tacos","category":"Breakfast for Dinner","night":"Easy","servings":4,"cook":"20 min","tags":["eggs","kid-friendly","breakfast"],"ingredients":[[8,"","eggs","Dairy"],[0.5,"lb","turkey breakfast sausage","Meat"],[8,"","small tortillas","Bread & Grains"],[0.5,"cup","shredded cheddar","Dairy"],[1,"","fruit for the side","Produce"]],"steps":["Brown and crumble sausage.","Scramble eggs over medium-low.","Serve in warm tortillas with cheddar. Kids: eggs, sausage, fruit and tortilla separate."],"source":"Family rotation list"},{"id":"chicken-alfredo","name":"Chicken Alfredo with Broccoli","category":"Weeknight","night":"Easy","servings":4,"cook":"20 min","tags":["chicken","pasta","kid-friendly","uses leftovers"],"ingredients":[[2,"cup","cooked chicken","Meat"],[12,"oz","fettuccine or penne","Pasta & Sauce"],[1,"jar (15 oz)","Alfredo sauce","Pasta & Sauce"],[2,"cup","broccoli florets","Produce"],[0.25,"cup","grated Parmesan","Dairy"]],"steps":["Boil pasta; add broccoli for the last 3 min. Save ½ cup pasta water, drain.","Warm Alfredo and chicken in the pot, loosen with pasta water.","Toss with pasta and broccoli, top with Parmesan."],"source":"Claude suggestion","notes":"Kids who won't eat broccoli: steam it separately and serve on the side."},{"id":"naan-pizzas","name":"Build-Your-Own Naan Pizzas","category":"Weeknight","night":"Easy","servings":4,"cook":"15 min","tags":["pizza","kid-friendly","build-your-own","fun night"],"ingredients":[[4,"","naan flatbreads","Bread & Grains"],[1,"cup","pizza sauce or marinara","Pasta & Sauce"],[2,"cup","shredded mozzarella","Dairy"],[1,"pack (6 oz)","pepperoni","Deli"],[1,"bag","salad kit (adults)","Produce"]],"steps":["Heat oven to 425°F. Set out naan, sauce, cheese, and toppings.","Everyone builds their own on a sheet pan.","Bake 8-10 min until cheese bubbles."],"source":"Claude suggestion","notes":"Kids love making their own — great Friday night. Use leftover marinara from spaghetti or Crockpot pasta."},{"id":"grilled-cheese-soup","name":"Grilled Cheese & Tomato Soup","category":"Weeknight","night":"Easy","servings":4,"cook":"15 min","tags":["vegetarian","kid-friendly","pantry meal"],"ingredients":[[8,"slices","bread","Bread & Grains"],[8,"slices","American or cheddar cheese","Dairy"],[2,"tbsp","butter","Dairy",1],[2,"cartons (32 oz)","creamy tomato soup","Soups & Mixes"],[1,"","apples or fruit","Produce"]],"steps":["Heat soup in a pot.","Butter bread, fill with cheese, cook in a skillet over medium 2-3 min per side.","Cut into strips for dipping."],"source":"Claude suggestion","notes":"Emergency backup dinner — keep soup in the pantry."},{"id":"teriyaki-bowls","name":"Teriyaki Chicken Rice Bowls","category":"Weeknight","night":"Easy","servings":4,"cook":"25 min","tags":["chicken","rice","kid-friendly"],"ingredients":[[1.5,"lb","boneless chicken thighs or breasts","Meat"],[0.5,"cup","teriyaki sauce","International"],[3,"cup","cooked rice","Bread & Grains"],[1,"bag (12 oz)","frozen stir-fry veggies or broccoli","Frozen"]],"steps":["Cut chicken into bite-size pieces; cook in a little oil over medium-high 6-8 min until 165°F.","Stir in teriyaki sauce and simmer 2 min until glossy.","Serve over rice with steamed veggies."],"source":"Claude suggestion","notes":"Sweet sauce = usually a kid hit. Plain chicken + rice for the pickiest."},{"id":"sheet-pan-nachos","name":"Sheet-Pan Nachos","category":"Sheet Pan","night":"Easy","servings":4,"cook":"20 min","tags":["beef","kid-friendly","uses leftovers","fun night"],"ingredients":[[1,"lb","ground beef (or leftover taco meat)","Meat"],[1,"tbsp","taco seasoning","Spices",1],[1,"bag (13 oz)","tortilla chips","Snacks"],[2,"cup","shredded cheddar or Mexican blend","Dairy"],[1,"can (15 oz)","black beans","Canned Goods"],[1,"tub","sour cream","Dairy"],[1,"jar","mild salsa","International"]],"steps":["Heat oven to 400°F. Brown beef with taco seasoning and a splash of water.","Spread chips on a lined sheet pan; top with beef, drained beans, and cheese.","Bake 6-8 min until melted. Salsa and sour cream at the table."],"source":"Claude suggestion","notes":"Make a 'kids' corner' with just chips, meat and cheese."},{"id":"cheeseburger-sliders","name":"Baked Cheeseburger Sliders","category":"Sheet Pan","night":"Easy","servings":4,"cook":"30 min","tags":["beef","sandwiches","kid-friendly"],"ingredients":[[1,"lb","ground beef","Meat"],[1,"pack (12)","Hawaiian rolls","Bread & Grains"],[6,"slices","American cheese","Dairy"],[0.5,"tsp","garlic powder","Spices",1],[2,"tbsp","butter","Dairy",1],[1,"bag","frozen fries or tots","Frozen"]],"steps":["Heat oven to 350°F. Brown beef with garlic powder, salt and pepper; drain.","Slice rolls as one slab; put bottoms in a 9x13. Layer beef and cheese, add tops.","Brush with melted butter, cover with foil, bake 15 min. Bake fries alongside per bag."],"source":"Claude suggestion","notes":"Ketchup/mustard/pickles at the table."},{"id":"mac-cheese-ham","name":"Stovetop Mac & Cheese with Ham & Peas","category":"Weeknight","night":"Easy","servings":4,"cook":"20 min","tags":["pasta","kid-friendly","pantry meal"],"ingredients":[[1,"lb","elbow macaroni","Pasta & Sauce"],[2,"tbsp","butter","Dairy",1],[2,"tbsp","flour","Baking",1],[2,"cup","milk","Dairy"],[2,"cup","shredded cheddar","Dairy"],[8,"oz","diced ham","Deli"],[1,"cup","frozen peas","Frozen"]],"steps":["Cook macaroni; add peas for the last 2 min. Drain.","Melt butter, whisk in flour 1 min, slowly whisk in milk and simmer until thick. Off heat stir in cheddar.","Stir in pasta, peas and ham."],"source":"Claude suggestion","notes":"Leave ham and peas on the side for kids who want 'just mac'."},{"id":"chicken-noodle-soup","name":"Easy Chicken Noodle Soup","category":"Weeknight","night":"Easy","servings":4,"cook":"30 min","tags":["chicken","soup","kid-friendly","uses leftovers","lunches"],"ingredients":[[2,"cup","cooked shredded chicken","Meat"],[8,"cup","low-sodium chicken broth","Soups & Mixes"],[2,"","carrots","Produce"],[2,"stalks","celery","Produce"],[0.5,"","yellow onion","Produce"],[8,"oz","egg noodles","Pasta & Sauce"],[1,"tsp","dried thyme","Spices",1]],"steps":["Sauté diced carrot, celery and onion in a little oil 5 min.","Add broth and thyme, simmer 10 min.","Add noodles and chicken, cook 6-8 min until noodles are tender. Salt to taste."],"source":"Claude suggestion","notes":"Great in a thermos for lunches."},{"id":"crockpot-meatball-subs","name":"Crockpot Meatball Subs","category":"Crockpot","night":"Crockpot","servings":4,"cook":"LOW 4 hr","tags":["beef","sandwiches","kid-friendly","no prep"],"ingredients":[[1,"bag (24 oz)","frozen meatballs","Frozen"],[1,"jar (24 oz)","marinara sauce","Pasta & Sauce"],[6,"","hoagie rolls","Bread & Grains"],[6,"slices","provolone or mozzarella","Dairy"]],"steps":["Dump frozen meatballs and marinara in the Crockpot. Cook LOW 4 hr or HIGH 2 hr.","Load into toasted rolls, top with cheese, broil 1-2 min to melt."],"source":"Claude suggestion","notes":"5-minute prep. Kids can have meatballs + bread on the side."},{"id":"crockpot-mississippi-roast","name":"Crockpot Mississippi Pot Roast","category":"Crockpot","night":"Crockpot","servings":6,"cook":"LOW 8 hr","tags":["beef","kid-friendly","makes leftovers"],"ingredients":[[3,"lb","chuck roast","Meat"],[1,"packet","dry ranch seasoning","Soups & Mixes"],[1,"packet","au jus gravy mix","Soups & Mixes"],[4,"tbsp","butter","Dairy",1],[5,"","pepperoncini (optional)","Condiments"],[2,"lb","potatoes (for mashing)","Produce"],[1,"bag (12 oz)","baby carrots","Produce"]],"steps":["Put roast in Crockpot, sprinkle both packets over, top with butter (and pepperoncini if using). No liquid needed.","Cook LOW 8 hr until it shreds.","Serve over mashed potatoes with roasted or steamed carrots."],"source":"Claude suggestion","notes":"Leftovers make great sandwiches or sliders. Skip pepperoncini for the kids."},{"id":"crockpot-chicken-pot-pie","name":"Crockpot Chicken Pot Pie with Biscuits","category":"Crockpot","night":"Crockpot","servings":6,"cook":"LOW 5 hr","tags":["chicken","kid-friendly","comfort food"],"ingredients":[[2,"lb","boneless chicken breasts","Meat"],[1,"can (10.5 oz)","cream of chicken soup","Canned Goods"],[1,"cup","low-sodium chicken broth","Soups & Mixes"],[1,"bag (12 oz)","frozen mixed vegetables","Frozen"],[0.5,"tsp","garlic powder","Spices",1],[1,"can (16 oz)","refrigerated biscuits","Dairy"]],"steps":["Add chicken, soup, broth and garlic powder to Crockpot. Cook LOW 5 hr until 165°F.","Shred chicken in the pot, stir in frozen veggies, cook 30 min more.","Bake biscuits per can. Spoon filling over split biscuits."],"source":"Claude suggestion"},{"id":"baked-ziti","name":"Baked Ziti (Make 2, Freeze 1)","category":"Big Cook","night":"Big Cook","servings":8,"cook":"1 hr","tags":["beef","pasta","kid-friendly","freezer-friendly"],"ingredients":[[1,"lb","ground beef or Italian sausage","Meat"],[1,"lb","ziti or penne","Pasta & Sauce"],[2,"jars (24 oz)","marinara sauce","Pasta & Sauce"],[15,"oz","ricotta","Dairy"],[3,"cup","shredded mozzarella","Dairy"],[0.5,"cup","grated Parmesan","Dairy"],[1,"tsp","Italian seasoning","Spices",1]],"steps":["Heat oven to 375°F. Boil pasta 2 min less than package says. Brown meat; stir in marinara and Italian seasoning.","Mix pasta with sauce and ricotta. Split between two 8x8 pans; top with mozzarella and Parmesan.","Bake one, covered, 20 min then uncovered 10 min. Cool, cover and freeze the second (bake from thawed, 35-40 min)."],"source":"Claude suggestion","notes":"One cook, two dinners. Makes 4 servings per pan."},{"id":"sheet-pan-fajitas","name":"Sheet-Pan Chicken Fajitas","category":"Sheet Pan","night":"Easy","servings":4,"cook":"30 min","tags":["chicken","tacos","build-your-own"],"ingredients":[[1.5,"lb","chicken breasts","Meat"],[3,"","bell peppers","Produce"],[1,"","yellow onion","Produce"],[2,"tbsp","taco or fajita seasoning","Spices",1],[8,"","small tortillas","Bread & Grains"],[1,"cup","shredded cheddar","Dairy"],[1,"tub","sour cream","Dairy"]],"steps":["Heat oven to 425°F. Slice chicken, peppers and onion into strips; toss with oil and seasoning on a sheet pan.","Roast 20-25 min until chicken is 165°F.","Serve in tortillas with cheese and sour cream."],"source":"Claude suggestion","notes":"Keep some chicken unseasoned or roast it on its own corner for picky kids."},{"id":"homemade-chicken-nuggets","name":"Big-Batch Chicken Nuggets (Freezer)","category":"Big Cook","night":"Big Cook","servings":8,"cook":"45 min","tags":["chicken","kid-friendly","freezer-friendly"],"ingredients":[[3,"lb","boneless chicken breasts","Meat"],[2,"","eggs","Dairy"],[2,"cup","panko","Baking"],[0.5,"cup","grated Parmesan","Dairy"],[1,"tsp","garlic powder","Spices",1],[1,"tsp","paprika","Spices",1],[1,"bag","frozen fries or tots","Frozen"]],"steps":["Heat oven to 425°F. Cut chicken into 1½-inch pieces.","Dip in beaten egg, then panko mixed with Parmesan and seasonings. Spread on 2 oiled sheet pans.","Bake 15-18 min, flipping once, until 165°F. Eat half; freeze the rest flat, then bag. Reheat at 400°F 10-12 min."],"source":"Claude suggestion","notes":"Cheaper and better than boxed nuggets."},{"id":"prep-shredded-chicken","name":"Prep Day: Big-Batch Shredded Chicken","category":"Prep Day","night":"Prep Day","servings":12,"cook":"LOW 4-5 hr (hands-off)","tags":["chicken","meal prep","base protein"],"ingredients":[[4,"lb","boneless chicken breasts","Meat"],[2,"cup","low-sodium chicken broth","Soups & Mixes"],[1,"tsp","garlic powder","Spices",1],[1,"tsp","salt","Spices",1]],"steps":["Add everything to Crockpot. Cook LOW 4-5 hr until 165°F.","Shred and portion into 2-cup containers with a little broth.","Fridge 3-4 days or freeze up to 3 months."],"source":"Claude suggestion","notes":"Makes ~8 cups — covers quesadillas, fried rice, Alfredo, broccoli pasta, chicken noodle soup and lunches."},{"id":"prep-ground-beef","name":"Prep Day: Batch-Browned Ground Beef","category":"Prep Day","night":"Prep Day","servings":12,"cook":"20 min","tags":["beef","meal prep","base protein"],"ingredients":[[3,"lb","lean ground beef or turkey","Meat"],[1,"tsp","garlic powder","Spices",1],[1,"tsp","salt","Spices",1]],"steps":["Brown all the beef in a large pot with garlic powder and salt; drain.","Cool and portion into 1-lb bags (about 2½ cups each).","Fridge 3-4 days or freeze flat. Season per meal: taco, spaghetti, sloppy joes, nachos."],"source":"Claude suggestion"},{"id":"prep-rice","name":"Prep Day: Big Pot of Rice","category":"Prep Day","night":"Prep Day","servings":12,"cook":"25 min","tags":["rice","meal prep"],"ingredients":[[3,"cup","uncooked long-grain rice","Bread & Grains"]],"steps":["Rinse rice. Combine with 6 cups water and 1 tsp salt; bring to a boil.","Cover, reduce to low, cook 18 min. Rest 5 min, fluff.","Cool quickly on a sheet pan, then portion. Fridge 4 days; freeze extra."],"source":"Claude suggestion","notes":"Makes ~9 cups. Day-old rice is perfect for fried rice."},{"id":"prep-roasted-veg","name":"Prep Day: Sheet-Pan Roasted Veggies","category":"Prep Day","night":"Prep Day","servings":8,"cook":"30 min","tags":["vegetarian","meal prep","sides"],"ingredients":[[2,"lb","potatoes","Produce"],[1,"bag (12 oz)","baby carrots","Produce"],[2,"head","broccoli","Produce"],[1,"tsp","garlic powder","Spices",1]],"steps":["Heat oven to 425°F. Cut veggies bite-size, toss each separately with oil, salt, garlic powder.","Roast on separate pans: potatoes 30 min, carrots 25 min, broccoli 15-18 min.","Portion into containers for dinners and lunches."],"source":"Claude suggestion","notes":"Keep each veg separate — kids are more likely to eat them that way."},{"id":"freezer-breakfast-burritos","name":"Freezer Breakfast Burritos","category":"Breakfast","night":"Prep Day","servings":12,"cook":"45 min","tags":["breakfast","eggs","freezer-friendly","grab-and-go"],"ingredients":[[12,"","eggs","Dairy"],[1,"lb","breakfast sausage","Meat"],[1,"bag (20 oz)","frozen diced hash browns","Frozen"],[2,"cup","shredded cheddar","Dairy"],[12,"","large tortillas","Bread & Grains"]],"steps":["Brown sausage; remove. Cook hash browns in the same pan until crisp.","Scramble eggs soft. Combine with sausage, potatoes and cheese; cool 10 min.","Fill and roll tortillas, wrap each in foil, freeze in a bag. Reheat: unwrap, wrap in paper towel, microwave 1½-2 min."],"source":"Claude suggestion","notes":"Make a few 'just egg and cheese' for picky kids — mark the foil."},{"id":"egg-muffins","name":"Ham & Cheese Egg Muffins","category":"Breakfast","night":"Prep Day","servings":12,"cook":"25 min","tags":["breakfast","eggs","grab-and-go","high protein"],"ingredients":[[10,"","eggs","Dairy"],[0.25,"cup","milk","Dairy"],[1,"cup","diced ham","Deli"],[1,"cup","shredded cheddar","Dairy"]],"steps":["Heat oven to 350°F. Grease a 12-cup muffin tin.","Whisk eggs, milk, salt and pepper. Divide ham and cheese into cups, pour egg over.","Bake 20-22 min until set. Fridge 4 days or freeze. Reheat 30-45 sec."],"source":"Claude suggestion"},{"id":"sheet-pan-pancakes","name":"Sheet-Pan Pancakes","category":"Breakfast","night":"Easy","servings":8,"cook":"20 min","tags":["breakfast","kid-friendly","freezer-friendly"],"ingredients":[[3,"cup","pancake mix","Baking"],[2,"cup","milk","Dairy"],[2,"","eggs","Dairy"],[1,"cup","blueberries or chocolate chips","Produce"],[1,"bottle","maple syrup","Baking",1]],"steps":["Heat oven to 425°F. Line and grease a sheet pan.","Mix pancake mix, milk and eggs; spread on pan. Sprinkle toppings in sections (plain section for picky kids).","Bake 12-15 min. Cut into squares; freeze extras and toast to reheat."],"source":"Claude suggestion"},{"id":"overnight-oats","name":"Overnight Oats Jars","category":"Breakfast","night":"Prep Day","servings":4,"cook":"5 min + overnight","tags":["breakfast","no cook","grab-and-go"],"ingredients":[[2,"cup","old-fashioned oats","Bread & Grains"],[2,"cup","milk","Dairy"],[1,"cup","vanilla yogurt","Dairy"],[2,"tbsp","honey or maple syrup","Baking",1],[1,"cup","berries or banana","Produce"]],"steps":["Divide oats, milk, yogurt and honey between 4 jars; stir.","Refrigerate overnight (keeps 4 days).","Top with fruit in the morning. Eat cold or microwave 1 min."],"source":"Claude suggestion","notes":"Kid version: add a spoon of peanut butter and mini chocolate chips."},{"id":"banana-muffins","name":"Banana Oat Muffins","category":"Breakfast","night":"Prep Day","servings":12,"cook":"30 min","tags":["breakfast","snack","kid-friendly","uses ripe bananas"],"ingredients":[[3,"","ripe bananas","Produce"],[2,"","eggs","Dairy"],[0.33,"cup","honey or brown sugar","Baking",1],[0.25,"cup","melted butter or oil","Dairy",1],[1.5,"cup","flour","Baking",1],[1,"cup","old-fashioned oats","Bread & Grains"],[1,"tsp","baking soda","Baking",1],[0.5,"cup","chocolate chips (optional)","Baking"]],"steps":["Heat oven to 350°F. Line a 12-cup muffin tin.","Mash bananas; whisk in eggs, honey and butter. Stir in flour, oats, baking soda and a pinch of salt; fold in chips.","Bake 18-22 min. Freeze extras."],"source":"Claude suggestion","notes":"Waste-saver: use the bananas no one ate this week."},{"id":"french-toast-sticks","name":"Freezer French Toast Sticks","category":"Breakfast","night":"Prep Day","servings":6,"cook":"30 min","tags":["breakfast","kid-friendly","freezer-friendly"],"ingredients":[[8,"slices","thick bread or Texas toast","Bread & Grains"],[4,"","eggs","Dairy"],[0.75,"cup","milk","Dairy"],[1,"tsp","cinnamon","Spices",1],[1,"tsp","vanilla","Baking",1]],"steps":["Heat oven to 400°F. Cut each slice into 3 sticks.","Dip in egg, milk, cinnamon and vanilla; set on a greased sheet pan.","Bake 15-18 min, flipping halfway. Freeze; reheat in toaster or air fryer."],"source":"Claude suggestion"},{"id":"yogurt-parfait-bar","name":"Yogurt Parfait Bar","category":"Breakfast","night":"Easy","servings":4,"cook":"5 min","tags":["breakfast","no cook","kid-friendly","build-your-own"],"ingredients":[[32,"oz","vanilla yogurt","Dairy"],[2,"cup","granola","Bread & Grains"],[2,"cup","berries","Produce"]],"steps":["Set out yogurt, granola and fruit.","Kids build their own cups."],"source":"Claude suggestion"},{"id":"scrambled-egg-toast","name":"Weekday Eggs & Toast Plate","category":"Breakfast","night":"Easy","servings":4,"cook":"10 min","tags":["breakfast","eggs","kid-friendly"],"ingredients":[[8,"","eggs","Dairy"],[4,"slices","bread","Bread & Grains"],[0.5,"cup","shredded cheddar","Dairy"],[1,"","fruit","Produce"]],"steps":["Scramble eggs low and slow with a pinch of salt; add cheese at the end.","Toast bread, cut into strips.","Serve with fruit."],"source":"Claude suggestion"},{"id":"bs-smash-burgers","name":"Blackstone Smash Burgers","category":"Blackstone","night":"Easy","servings":4,"cook":"20 min","tags":["beef","burgers","kid-friendly"],"ingredients":[[1.5,"lb","80/20 ground beef","Meat"],[8,"slices","American cheese","Dairy"],[6,"","burger buns","Bread & Grains"],[1,"tbsp","butter","Dairy",1],[1,"","yellow onion (optional)","Produce"],[1,"bag","frozen fries or tots","Frozen"]],"steps":["Roll beef into 12 loose 2-oz balls. Heat griddle to high (~450°F). Butter and toast buns; set aside.","Place balls on griddle, smash flat with a spatula (parchment between helps), season with salt and pepper. Add thin onion on top if using.","Cook 2 min until crusty, flip, add cheese, cook 1 min. Stack 2 per bun."],"source":"Claude suggestion","notes":"Kids: single patty with cheese, ketchup only. Air-fry tots alongside."},{"id":"bs-hibachi-chicken","name":"Blackstone Hibachi Chicken & Fried Rice","category":"Blackstone","night":"Big Cook","servings":4,"cook":"30 min","tags":["chicken","rice","kid-friendly","fun night"],"ingredients":[[1.5,"lb","boneless chicken breasts or thighs","Meat"],[4,"cup","cold cooked rice","Bread & Grains"],[3,"","eggs","Dairy"],[2,"cup","frozen peas and carrots","Frozen"],[2,"","zucchini (optional)","Produce"],[1,"","yellow onion","Produce"],[4,"tbsp","butter","Dairy",1],[0.25,"cup","low-sodium soy sauce","International",1],[1,"tsp","garlic powder","Spices",1],[1,"bottle","yum yum sauce","Condiments"]],"steps":["Heat griddle to medium-high. Cut chicken bite-size. Oil griddle.","Cook chicken with 1 tbsp butter, salt, pepper, garlic powder and a splash of soy 6-8 min to 165°F; move to cool side. Cook onion and zucchini on another zone.","Fried rice: scramble eggs, add rice, peas/carrots, 2 tbsp butter and soy; toss until hot and crispy. Serve with yum yum sauce."],"source":"Claude suggestion","notes":"Day-old rice works best — use Prep Day rice. Kids get chicken + plain-ish rice."},{"id":"bs-philly","name":"Blackstone Philly Cheesesteaks","category":"Blackstone","night":"Easy","servings":4,"cook":"20 min","tags":["beef","sandwiches"],"ingredients":[[1.5,"lb","shaved steak or thin-sliced ribeye","Meat"],[1,"","yellow onion","Produce"],[1,"","green bell pepper","Produce"],[8,"slices","provolone or white American","Dairy"],[4,"","hoagie rolls","Bread & Grains"],[1,"tsp","garlic powder","Spices",1]],"steps":["Heat griddle to medium-high. Cook sliced onion and pepper in oil 5-6 min.","Add steak, season with salt, pepper and garlic powder; chop with spatulas 3-4 min until browned. Mix in veggies (leave some plain for kids).","Divide into 4 piles, top with cheese, cover 1 min to melt. Scoop into toasted rolls."],"source":"Claude suggestion","notes":"Chicken Philly: swap thin-sliced chicken breast."},{"id":"bs-breakfast","name":"Blackstone Big Breakfast","category":"Blackstone","night":"Big Cook","servings":4,"cook":"25 min","tags":["breakfast","breakfast for dinner","kid-friendly","weekend"],"ingredients":[[1,"lb","bacon","Meat"],[8,"","eggs","Dairy"],[2,"cup","pancake mix","Baking"],[1.5,"cup","milk","Dairy"],[1,"bag (20 oz)","frozen shredded hash browns","Frozen"],[1,"bottle","maple syrup","Baking",1]],"steps":["Heat griddle to medium. Cook bacon on one side; push to the cool zone.","Spread hash browns in the bacon fat; cook 5 min per side until crispy. Mix pancake batter and pour pancakes on another zone.","Crack eggs last; cook to order. Serve everything family-style."],"source":"Claude suggestion","notes":"Weekend morning or breakfast-for-dinner night."},{"id":"bs-chicken-lo-mein","name":"Blackstone Chicken Lo Mein","category":"Blackstone","night":"Easy","servings":4,"cook":"25 min","tags":["chicken","noodles"],"ingredients":[[1.5,"lb","boneless chicken thighs","Meat"],[12,"oz","lo mein noodles or spaghetti","Pasta & Sauce"],[1,"bag (12 oz)","coleslaw mix or stir-fry veggies","Produce"],[0.33,"cup","low-sodium soy sauce","International",1],[2,"tbsp","brown sugar","Baking",1],[1,"tbsp","sesame oil","International",1],[3,"cloves","garlic","Produce"]],"steps":["Boil noodles until just tender; drain and toss with sesame oil. Mix soy, brown sugar and minced garlic.","Heat griddle to medium-high. Cook bite-size chicken 6-8 min to 165°F. Add veggies 2-3 min.","Add noodles and sauce; toss 2 min until glossy."],"source":"Claude suggestion","notes":"Set aside buttered noodles + plain chicken for picky kids."},{"id":"bs-smash-tacos","name":"Blackstone Smash Burger Tacos","category":"Blackstone","night":"Easy","servings":4,"cook":"20 min","tags":["beef","tacos","kid-friendly","fun night"],"ingredients":[[1.25,"lb","ground beef","Meat"],[8,"","small flour tortillas","Bread & Grains"],[1.5,"cup","shredded cheddar","Dairy"],[1,"tbsp","taco seasoning","Spices",1],[1,"","pickles, shredded lettuce, burger sauce (optional)","Produce"]],"steps":["Heat griddle to medium-high. Roll beef into 8 balls.","Put a ball on each tortilla, smash flat across it, sprinkle with taco seasoning. Flip meat-side down; cook 2-3 min until crusty.","Flip, add cheese, fold. Top with lettuce, pickles and sauce."],"source":"Claude suggestion","notes":"TikTok-famous and a big kid hit."},{"id":"bs-quesadillas","name":"Blackstone Quesadilla Night","category":"Blackstone","night":"Easy","servings":4,"cook":"15 min","tags":["chicken","kid-friendly","uses leftovers","build-your-own"],"ingredients":[[3,"cup","cooked shredded chicken or taco meat","Meat"],[8,"","large tortillas","Bread & Grains"],[3,"cup","shredded Mexican blend","Dairy"],[1,"jar","mild salsa","International"],[1,"tub","sour cream","Dairy"]],"steps":["Heat griddle to medium.","Lay out tortillas, add cheese and fillings to half, fold.","Cook 2-3 min per side until golden. Cook 4-6 at once."],"source":"Claude suggestion","notes":"Uses Prep Day chicken or leftover taco meat."},{"id":"tr-pulled-pork","name":"Traeger Smoked Pulled Pork","category":"Traeger","night":"Big Cook","servings":10,"cook":"10-12 hr","tags":["pork","sandwiches","makes leftovers","weekend","freezer-friendly"],"ingredients":[[8,"lb","bone-in pork butt (shoulder)","Meat"],[0.25,"cup","yellow mustard (binder)","Condiments",1],[0.5,"cup","pork/BBQ rub","Spices"],[1,"cup","apple juice","Beverages"],[1,"bottle","BBQ sauce","Condiments"],[10,"","buns","Bread & Grains"]],"steps":["Smear pork with mustard, coat with rub. Smoke at 225-250°F until internal hits ~165°F (6-8 hr).","Wrap in foil with ½ cup apple juice; raise to 275°F. Cook until 200-203°F and probe-tender (3-4 hr).","Rest wrapped 1 hr. Shred, mix in some juices. Sauce on the side."],"source":"Claude suggestion","notes":"Huge yield — freeze in 1-lb bags for nachos, quesadillas, BBQ pizza and sliders on future weeks."},{"id":"tr-spatchcock-chicken","name":"Traeger Spatchcock Chicken","category":"Traeger","night":"Big Cook","servings":4,"cook":"1.5 hr","tags":["chicken","kid-friendly","makes leftovers"],"ingredients":[[5,"lb","whole chicken","Meat"],[2,"tbsp","chicken or poultry rub","Spices"],[2,"tbsp","butter","Dairy",1],[2,"lb","potatoes","Produce"]],"steps":["Cut out the backbone with kitchen shears and press the chicken flat. Pat dry, rub with butter and rub.","Smoke at 225°F for 30 min, then raise to 375°F. Cook until thigh is 175°F and breast 160-165°F (about 1 hr more).","Rest 10 min. Roast potatoes on the grill alongside."],"source":"Claude suggestion","notes":"Shred leftovers for next-day quesadillas or soup."},{"id":"tr-wings-drums","name":"Traeger Smoked Drumsticks or Wings","category":"Traeger","night":"Easy","servings":4,"cook":"1.5 hr","tags":["chicken","kid-friendly","finger food","game day"],"ingredients":[[4,"lb","chicken drumsticks or wings","Meat"],[2,"tbsp","chicken rub","Spices"],[1,"cup","BBQ or Buffalo sauce (optional)","Condiments"],[1,"bottle","ranch dressing","Condiments",1]],"steps":["Pat chicken dry; toss with oil and rub.","Smoke at 225°F for 30 min, then raise to 400°F and cook 30-40 min until 175-185°F and crispy.","Toss half in sauce; leave half plain for the kids."],"source":"Claude suggestion","notes":"Drumsticks are the cheapest chicken cut — big money saver."},{"id":"tr-meatloaf","name":"Traeger Smoked Meatloaf","category":"Traeger","night":"Big Cook","servings":6,"cook":"2 hr","tags":["beef","kid-friendly","makes leftovers"],"ingredients":[[2,"lb","ground beef","Meat"],[2,"","eggs","Dairy"],[0.75,"cup","breadcrumbs","Baking"],[0.5,"cup","milk","Dairy"],[1,"tsp","garlic powder","Spices",1],[1,"tsp","onion powder","Spices",1],[0.75,"cup","ketchup + 2 tbsp brown sugar (glaze)","Condiments",1],[2,"lb","potatoes (for mashing)","Produce"]],"steps":["Mix beef, eggs, breadcrumbs, milk, garlic and onion powder, salt and pepper. Shape a loaf on a foil-lined tray.","Smoke at 225°F for 1 hr, then raise to 350°F.","Brush with ketchup-sugar glaze; cook until 160°F (45-60 min more). Rest 10 min. Serve with mashed potatoes."],"source":"Claude suggestion","notes":"Leftover meatloaf sandwiches = great lunches."},{"id":"tr-burgers","name":"Traeger Smoked Cheeseburgers","category":"Traeger","night":"Easy","servings":4,"cook":"45 min","tags":["beef","burgers","kid-friendly"],"ingredients":[[2,"lb","80/20 ground beef","Meat"],[6,"slices","cheddar or American","Dairy"],[6,"","buns","Bread & Grains"],[1,"tbsp","burger seasoning","Spices",1]],"steps":["Form 6 patties, press a thumbprint in the center, season.","Smoke at 225°F for 25-30 min, then raise to 450°F (or move to Blackstone) and sear 2-3 min per side to 160°F.","Add cheese the last minute."],"source":"Claude suggestion"},{"id":"tr-pork-tenderloin","name":"Traeger Brown Sugar Pork Tenderloin","category":"Traeger","night":"Easy","servings":4,"cook":"1 hr","tags":["pork","kid-friendly"],"ingredients":[[2,"","pork tenderloins (~2.5 lb total)","Meat"],[2,"tbsp","pork rub","Spices"],[2,"tbsp","brown sugar","Baking",1],[2,"tbsp","honey","Baking",1],[12,"oz","green beans","Frozen"],[1,"pouch","rice or mashed potatoes","Bread & Grains"]],"steps":["Coat tenderloins with oil, rub and brown sugar.","Smoke at 250°F until 135°F inside (~45 min).","Brush with honey, raise to 400°F and sear to 145°F. Rest 5 min, slice."],"source":"Claude suggestion","notes":"Lean, cheap, and it tastes 'like ham' to kids."},{"id":"tr-smoked-mac","name":"Traeger Smoked Mac & Cheese","category":"Traeger","night":"Big Cook","servings":8,"cook":"1 hr","tags":["side","pasta","kid-friendly"],"ingredients":[[1,"lb","elbow macaroni","Pasta & Sauce"],[4,"tbsp","butter","Dairy",1],[0.25,"cup","flour","Baking",1],[3,"cup","milk","Dairy"],[3,"cup","shredded cheddar","Dairy"],[1,"cup","shredded mozzarella or Monterey Jack","Dairy"]],"steps":["Cook macaroni 2 min short. Make cheese sauce: butter + flour 1 min, whisk in milk until thick, stir in 2½ cups cheese.","Mix with pasta in a foil pan; top with remaining cheese.","Smoke at 225°F for 30 min, then 350°F for 15-20 min until bubbly."],"source":"Claude suggestion","notes":"Perfect side for pulled pork or drumsticks night."},{"id":"tr-pizza","name":"Traeger Pizza Night","category":"Traeger","night":"Easy","servings":4,"cook":"30 min","tags":["pizza","kid-friendly","build-your-own","fun night"],"ingredients":[[2,"","store-bought pizza dough balls","Bakery"],[1,"cup","pizza sauce","Pasta & Sauce"],[3,"cup","shredded mozzarella","Dairy"],[1,"pack","pepperoni","Deli"]],"steps":["Preheat Traeger to 450-500°F with a pizza stone or pan inside for 20 min.","Stretch dough, top with sauce, cheese, toppings (kids make their own).","Bake 10-14 min until crust is golden."],"source":"Claude suggestion","notes":"Leftover pulled pork + BBQ sauce makes a great adult pizza."},{"id":"honey-mustard-thighs","name":"Honey Mustard Baked Chicken Thighs","category":"Weeknight","night":"Easy","servings":4,"cook":"35 min","tags":["chicken","kid-friendly","oven"],"ingredients":[[2,"lb","boneless chicken thighs","Meat"],[0.33,"cup","honey","Baking",1],[0.25,"cup","yellow or Dijon mustard","Condiments",1],[1,"tsp","garlic powder","Spices",1],[2,"cup","rice","Bread & Grains"],[1,"bag (12 oz)","frozen broccoli","Frozen"]],"steps":["Heat oven to 400°F. Whisk honey, mustard, garlic powder, salt and pepper.","Toss chicken in sauce in a baking dish.","Bake 25-30 min until 175°F. Serve over rice with broccoli; spoon pan sauce over."],"source":"Claude suggestion"},{"id":"parmesan-chicken","name":"Parmesan Crusted Chicken","category":"Weeknight","night":"Easy","serving  Grains"]],"steps":["Brown beef with taco seasoning and ½ cup water.","Warm tortillas. Spread beans, add rice, beef and cheese. Roll tightly.","Wrap each in foil and freeze. Microwave 2-3 min (unwrapped, in paper towel) or bake at 375°F 25 min."],"source":"Claude suggestion","notes":"Easy lunches all week. Make some 'bean & cheese only'."},{"id":"korean-beef-bowls","name":"Korean Ground Beef Bowls","category":"Weeknight","night":"Easy","servings":4,"cook":"20 min","tags":["beef","rice","budget"],"ingredients":[[1,"lb","ground beef","Meat"],[0.25,"cup","low-sodium soy sauce","International",1],[3,"tbsp","brown sugar","Baking",1],[1,"tbsp","sesame oil","International",1],[3,"cloves","garlic","Produce"],[3,"cup","cooked rice","Bread & Grains"],[1,"bag","frozen edamame or broccoli","Frozen"]],"steps":["Brown beef with minced garlic; drain.","Stir in soy, brown sugar and sesame oil; simmer 2 min.","Serve over rice with veggies."],"source":"Claude suggestion","notes":"Sweet-salty — similar to teriyaki, usually kid approved."},{"id":"tater-tot-casserole","name":"Tater Tot Casserole","category":"Big Cook","night":"Big Cook","servings":6,"cook":"50 min","tags":["beef","kid-friendly","comfort food"],"ingredients":[[1.5,"lb","ground beef","Meat"],[1,"can (10.5 oz)","cream of mushroom or chicken soup","Canned Goods"],[0.5,"cup","sour cream","Dairy"],[2,"cup","frozen green beans or mixed veg","Frozen"],[2,"cup","shredded cheddar","Dairy"],[1,"bag (32 oz)","frozen tater tots","Frozen"]],"steps":["Heat oven to 375°F. Brown beef; drain. Stir in soup, sour cream and veggies.","Spread in 9x13, top with cheese then tots in rows.","Bake 35-40 min until tots are crispy."],"source":"Claude suggestion"}]</script>
<script>
(function(){
"use strict";
const BUILTIN = JSON.parse(document.getElementById('recipe-data').textContent);
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYFULL = {Sun:'Sunday',Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday'};
const TYPES = ['Easy','Crockpot','Big Cook','Grill','Fun','Off'];
const TYPE_COLOR = {'Easy':'var(--basil)','Crockpot':'var(--mustard)','Big Cook':'var(--tomato)','Grill':'#7a5cc7','Fun':'#2a8fb5','Off':'var(--line)'};
const CAT_COLOR = {'Crockpot':'var(--mustard)','Weeknight':'var(--basil)','Sheet Pan':'#2a8fb5','Big Cook':'var(--tomato)','Prep Day':'#5f6f66','Breakfast':'#e08a2e','Breakfast for Dinner':'#e08a2e','Blackstone':'#7a5cc7','Traeger':'#8a4b2a','My Recipes':'#c04a8a','From Friends':'#c04a8a'};
const CAT_ORDER = ['Crockpot','Weeknight','Sheet Pan','Blackstone','Traeger','Big Cook','Prep Day','Breakfast','Breakfast for Dinner'];
const SECTIONS = ['Produce','Meat','Deli','Dairy','Bakery','Bread & Grains','Pasta & Sauce','Canned Goods','Soups & Mixes','International','Condiments','Baking','Spices','Snacks','Frozen','Beverages','Other'];
const DEFAULT_TYPES = {Sun:'Big Cook',Mon:'Easy',Tue:'Crockpot',Wed:'Easy',Thu:'Grill',Fri:'Fun',Sat:'Crockpot'};

/* ---------- state ---------- */
const LS_KEY='pocketpantry.v1';
function fresh(){return {household:4,lunches:1,kidMode:true,assumeStaples:true,equip:{crockpot:true,blackstone:true,traeger:true},
  plan:{days:DAYS.map(d=>({day:d,type:DEFAULT_TYPES[d],id:null,mult:null})),prep:[],breakfast:[]},
  pantry:[],have:{},checked:{},favs:{},custom:[]};}
let S = fresh();
try{const raw=localStorage.getItem(LS_KEY); if(raw) S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
let dbReady=false; let db=null, userId=null, userNs=null, sampleFn=null, shared=[]; let saveTimer=null, saving=false, dirty=false;
function persist(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
  if(!db||!userId||!dbReady) return;
  dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(saving||!dirty) return; saving=true; dirty=false;
  try{ await db.collection('data/users/'+userId).doc('state').set({json:JSON.stringify(S),t:Date.now()}); setSync('Synced to your account'); }
  catch(e){ setSync('Saved on this device'); }
  saving=false; if(dirty) flush();
}
function setSync(t){document.getElementById('sync').textContent=t;}

/* ---------- recipes & normalizing ---------- */
const STOP=new Set(['boneless','skinless','lean','low-sodium','fresh','large','small','medium','packed','thin-sliced','thinly','sliced','diced','minced','chopped','raw','fully','optional','for','the','a','of','and','or','plus','to','serve','serving','topping','toppings','store-bought','cold','old-fashioned','oil-packed','grated','finely','softened','cubed','drained','rinsed','mild','dry','whole','thick','bite-size','frozen','refrigerated','uncooked','long-grain','bone-in','crushed']);
function sing(w){ if(w.length>3 && /ies$/.test(w)) return w.slice(0,-3)+'y'; if(w.length>3 && /oes$/.test(w)) return w.slice(0,-2); if(w.length>3 && /[^s]s$/.test(w)) return w.slice(0,-1); return w; }
function toks(s){ return s.toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^a-z0-9/ -]/g,' ').split(/\s+/).filter(w=>w&&!STOP.has(w)).map(sing); }
const KEYRULES=[
 [/cooked.*chicken|chicken.*cooked|leftover.*chicken/,'cooked chicken'],[/cooked rice|cooked.*rice/,'cooked rice'],
 [/ground beef|ground turkey|hamburger/,'ground beef'],[/chicken breast/,'chicken breasts'],[/chicken thigh/,'chicken thighs'],[/chicken tender/,'chicken tenders'],[/drumstick|chicken wing/,'chicken drumsticks or wings'],
 [/breakfast sausage/,'breakfast sausage'],[/italian.*sausage/,'Italian sausage'],[/chicken sausage/,'chicken sausage'],
 [/chuck roast/,'chuck roast'],[/pork shoulder|pork butt/,'pork shoulder'],[/pork tenderloin/,'pork tenderloin'],[/shaved steak|ribeye/,'shaved steak'],
 [/marinara|pizza sauce/,'marinara / pizza sauce'],[/alfredo/,'Alfredo sauce'],[/salsa verde/,'salsa verde'],[/salsa/,'mild salsa'],
 [/cheddar|mexican blend|monterey jack/,'shredded cheddar'],[/mozzarella/,'shredded mozzarella'],[/parmesan/,'Parmesan'],[/provolone|swiss|white american/,'sliced provolone'],[/american cheese|cheddar cheese slices|american or cheddar/,'American cheese slices'],
 [/cream cheese/,'cream cheese'],[/sour cream/,'sour cream'],[/ricotta/,'ricotta'],[/yogurt/,'vanilla yogurt'],[/^eggs?$|^egg /,'eggs'],[/milk/,'milk'],[/butter/,'butter'],
 [/large tortilla|tortillas or rice/,'large flour tortillas'],[/tortilla chip/,'tortilla chips'],[/tortilla/,'small tortillas'],[/hoagie/,'hoagie rolls'],[/hawaiian roll/,'Hawaiian rolls'],[/slider bun/,'slider buns'],[/bun/,'buns'],[/naan/,'naan'],[/bread|texas toast/,'bread'],
 [/russet|potatoes/,'potatoes'],[/hash brown/,'frozen hash browns'],[/tater tot|fries or tots/,'frozen fries / tots'],
 [/green bean/,'green beans'],[/broccoli/,'broccoli'],[/peas and carrots/,'frozen peas & carrots'],[/frozen peas|^peas/,'frozen peas'],[/mixed vegetables|mixed veg/,'frozen mixed vegetables'],[/stir-fry/,'frozen stir-fry veggies'],[/black beans/,'black beans'],[/corn on the cob/,'corn on the cob'],[/corn/,'corn'],
 [/yellow onion|^onions?$/,'yellow onions'],[/garlic powder/,'garlic powder'],[/garlic/,'garlic'],[/bell pepper|green bell/,'bell peppers'],[/lime/,'limes'],[/baby carrot|carrots/,'carrots'],[/spinach/,'baby spinach'],[/banana/,'bananas'],[/berries|blueberries/,'berries'],
 [/chicken broth/,'chicken broth'],[/beef broth/,'beef broth'],[/taco seasoning|fajita/,'taco seasoning'],[/ranch seasoning/,'ranch seasoning packet'],[/au jus/,'au jus mix'],[/onion soup mix/,'onion soup mix'],[/cream of chicken/,'cream of chicken soup'],[/cream of mushroom/,'cream of mushroom soup'],
 [/italian seasoning/,'Italian seasoning'],[/soy sauce/,'soy sauce'],[/bbq sauce/,'BBQ sauce'],[/pepperoncini/,'pepperoncini'],[/panko|crushed crackers/,'panko'],[/breadcrumb/,'breadcrumbs'],[/honey/,'honey'],[/oats/,'oats'],[/pancake mix/,'pancake mix'],[/maple syrup/,'maple syrup'],
 [/^rice$|rice \(|^rice /,'rice'],[/elbow/,'elbow macaroni'],[/egg noodle/,'egg noodles'],[/spaghetti/,'spaghetti'],[/penne|rotini|ziti|short pasta|fettuccine/,'short pasta'],[/^pasta|lasagna/,'pasta']
];
function keyOf(item){ const s=item.toLowerCase().replace(/\(.*?\)/g,' ').trim(); for(const [re,k] of KEYRULES){ if(re.test(s)) return k; } return toks(item).join(' ')||s; }
function normUnit(u){ u=(u||'').trim(); u=u.replace(/^(jar|can|carton|bag|pack|packet|box|bottle|tub|head)s\b/,'$1'); if(u==='cups')return 'cup'; if(u==='lbs')return 'lb'; return u; }
const COUNT_UNIT=/^(|jar|can|carton|bag|pack|packet|box|bottle|tub|head|bunch|sleeve|pouch|slices|cloves|stalks|clove|slice)\b/;
function prep(r,src){
  r.ingredients=(r.ingredients||[]).map(i=>Object.assign({},i,{unit:normUnit(i.unit),key:keyOf(i.item||''),opt:/optional/i.test(i.item||'')}));
  r.tags=r.tags||[]; r.kid=r.tags.includes('kid-friendly'); r.src=src; r.night=r.night||(r.category==='Crockpot'?'Crockpot':'Easy');
  return r;
}
BUILTIN.forEach(r=>{ r.ingredients=r.ingredients.map(i=>Array.isArray(i)?{qty:i[0],unit:i[1],item:i[2],section:i[3],pantry:!!i[4]}:i); prep(r,'builtin'); });
function allRecipes(){ return BUILTIN.concat(S.custom.map(r=>prep(r,'mine')), shared.map(r=>prep(r,'friend'))); }
function byId(id){ return allRecipes().find(r=>r.id===id); }
function equipOK(r){ if(r.category==='Crockpot'&&!S.equip.crockpot)return false; if(r.category==='Blackstone'&&!S.equip.blackstone)return false; if(r.category==='Traeger'&&!S.equip.traeger)return false; return true; }
function isDinner(r){ return !['Breakfast','Prep Day'].includes(r.category) && !r.tags.includes('side'); }

/* ---------- formatting ---------- */
function frac(n){ if(n==null||isNaN(n)) return ''; const w=Math.floor(n+1e-6), f=n-w; const map=[[0,''],[.25,'¼'],[.33,'⅓'],[.5,'½'],[.67,'⅔'],[.75,'¾'],[1,'']]; let best=map[0],d=9; for(const m of map){const dd=Math.abs(f-m[0]); if(dd<d){d=dd;best=m;}} let whole=w+(best[0]===1?1:0); const s=(whole?whole:'')+best[1]; return s||'0'; }
function roundQty(q,unit){ if(COUNT_UNIT.test(unit)) return Math.max(1,Math.ceil(q-0.05)); return Math.round(q*4)/4||0.25; }
function qtyStr(q,unit){ const n=frac(q); if(!unit) return n; return n+' '+unit; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1800); }

/* ---------- scaling ---------- */
function dinnerFactor(r,d){ if(d&&d.mult) return d.mult; const target=S.household+S.lunches; const f=target/(r.servings||4); return Math.max(0.5,Math.round(f*4)/4); }
function servingsFor(r,f){ return Math.round((r.servings||4)*f); }

/* ---------- pantry matching ---------- */
function pantryHas(key){
  const kt=toks(key); if(!kt.length) return false;
  return S.pantry.some(p=>{ const pt=toks(p); if(!pt.length) return false; const pk=keyOf(p); if(pk===key) return true;
    return pt.every(w=>kt.includes(w)) || kt.every(w=>pt.includes(w)); });
}

/* ---------- auto planner ---------- */
const MAIN_PROT=r=>{ const k=r.ingredients.find(i=>i.section==='Meat'); return k?k.key.split(' ').slice(-1)[0]:'veg'; };
function candidates(type){
  const all=allRecipes().filter(r=>isDinner(r)&&equipOK(r)&&!(S.kidMode&&r.tags.includes('spicy')));
  switch(type){
    case 'Easy': return all.filter(r=>r.night==='Easy'&&!['Crockpot'].includes(r.category));
    case 'Crockpot': return S.equip.crockpot? all.filter(r=>r.category==='Crockpot') : all.filter(r=>r.night==='Easy');
    case 'Big Cook': return all.filter(r=>r.night==='Big Cook'||r.tags.includes('makes leftovers')&&r.category!=='Crockpot');
    case 'Grill': { const g=all.filter(r=>r.category==='Blackstone'||r.category==='Traeger'); return g.length?g:all.filter(r=>r.category==='Sheet Pan'); }
    case 'Fun': return all.filter(r=>r.tags.some(t=>['fun night','build-your-own','pizza','burgers','finger food'].includes(t)));
    default: return [];
  }
}
function planKeys(excludeIdx){ const ks=new Set(); S.plan.days.forEach((d,i)=>{ if(i===excludeIdx||!d.id) return; const r=byId(d.id); if(r) r.ingredients.forEach(x=>{ if(!x.pantry&&!/^cooked/.test(x.key)) ks.add(x.key); }); }); return ks; }
function score(r,keys,used,prevProt,makesChicken){
  let s=0; r.ingredients.forEach(x=>{ if(!x.pantry&&keys.has(x.key)) s+=2; if(!x.pantry&&pantryHas(x.key)) s+=1.5; });
  if(S.kidMode&&r.kid) s+=2.5; if(S.favs[r.id]) s+=3; if(used.has(r.id)) s-=100;
  if(prevProt&&MAIN_PROT(r)===prevProt) s-=2;
  if(r.ingredients.some(x=>x.key==='cooked chicken')) s+= makesChicken?3:-1;
  return s+Math.random()*3;
}
function pickFor(i){
  const d=S.plan.days[i]; if(d.type==='Off'){d.id=null;return;}
  const cands=candidates(d.type); if(!cands.length){d.id=null;return;}
  const keys=planKeys(i); const used=new Set(S.plan.days.filter((x,j)=>j!==i&&x.id).map(x=>x.id));
  const prev=i>0&&S.plan.days[i-1].id?byId(S.plan.days[i-1].id):null; const prevProt=prev?MAIN_PROT(prev):null;
  const makesChicken=S.plan.days.some((x,j)=>j<i&&x.id&&(byId(x.id)||{tags:[]}).tags.includes('makes leftovers'))||S.plan.prep.includes('prep-shredded-chicken');
  const ranked=cands.map(r=>[score(r,keys,used,prevProt,makesChicken),r]).sort((a,b)=>b[0]-a[0]);
  d.id=ranked[0][1].id; d.mult=null;
}
function autoExtras(){
  const ids=S.plan.days.filter(d=>d.id).map(d=>byId(d.id)).filter(Boolean);
  const needs=k=>ids.some(r=>r.ingredients.some(x=>x.key===k));
  const prepSet=new Set(S.plan.prep.filter(id=>!['prep-shredded-chicken','prep-rice'].includes(id)));
  if(needs('cooked chicken')) prepSet.add('prep-shredded-chicken');
  if(needs('cooked rice')) prepSet.add('prep-rice');
  S.plan.prep=[...prepSet].filter(id=>byId(id));
  if(S.plan.breakfast.length===0){
    const keys=planKeys(-1); const bk=allRecipes().filter(r=>r.category==='Breakfast');
    const pick=(list)=>list.map(r=>[ (r.ingredients.filter(x=>keys.has(x.key)).length*2)+(r.kid?2:0)+Math.random()*3,r]).sort((a,b)=>b[0]-a[0])[0];
    const a=pick(bk.filter(r=>r.night==='Prep Day')); const b=pick(bk.filter(r=>r.night!=='Prep Day'));
    S.plan.breakfast=[a&&a[1].id,b&&b[1].id].filter(Boolean);
  }
}
function autoPlan(){ S.plan.days.forEach(d=>{d.id=null;d.mult=null;}); S.plan.breakfast=[]; S.plan.prep=[]; for(let i=0;i<7;i++) pickFor(i); autoExtras(); S.checked={}; persist(); render(); toast('New week planned'); }

/* ---------- grocery ---------- */
function planItems(){
  const out=[]; S.plan.days.forEach(d=>{ if(!d.id) return; const r=byId(d.id); if(r) out.push({r,f:dinnerFactor(r,d),label:d.day}); });
  S.plan.prep.forEach(id=>{const r=byId(id); if(r) out.push({r,f:1,label:'Prep'});});
  S.plan.breakfast.forEach(id=>{const r=byId(id); if(r) out.push({r,f:1,label:'Bkfst'});});
  return out;
}
function grocery(){
  const items=planItems(); const madePrep=new Set(); items.filter(x=>x.label==='Prep').forEach(x=>{ if(x.r.id==='prep-shredded-chicken') madePrep.add('cooked chicken'); if(x.r.id==='prep-rice'){madePrep.add('cooked rice');} });
  const map=new Map();
  items.forEach(({r,f})=>{ r.ingredients.forEach(x=>{
    if(madePrep.has(x.key)) return;
    let key=x.key, section=x.section||'Other';
    if(key==='cooked chicken'){ section='Meat'; }
    if(!map.has(key)) map.set(key,{key,name:key==='cooked chicken'?'cooked chicken (rotisserie works)':key,section,pantry:!!x.pantry,amts:{},uses:new Set(),optional:true});
    const g=map.get(key); g.pantry=g.pantry&&!!x.pantry; if(!x.opt) g.optional=false; if(!SECTIONS.includes(g.section)) g.section='Other';
    const u=x.unit||''; g.amts[u]=(g.amts[u]||0)+x.qty*f; g.uses.add(r.name);
  });});
  const list=[...map.values()].map(g=>{ g.qtyText=Object.entries(g.amts).map(([u,q])=>qtyStr(roundQty(q,u),u)).join(' + '); g.have=!!S.have[g.key]||pantryHas(g.key); return g; });
  return list;
}

function itemRow(x,buy){

  ${buy?`<button class="havebtn" data-have="${esc(x.key)}">Have it</button>`:`<button class="havebtn" data-need="${esc(x.key)}">Need it</button>`}</label>
  <span class="qty">${esc(x.qtyText)}</span></div>`;
}
function listText(toBuy,staples){
  let t='Pocket Pantry grocery list\n';
  SECTIONS.forEach(sec=>{ const it=toBuy.filter(x=>x.section===sec&&!S.checked[x.key]); if(!it.length) return; t+=`\n${sec.toUpperCase()}\n`; it.forEach(x=>t+=`- ${x.name}: ${x.qtyText}${x.optional?' (optional)':''}\n`); });
  if(staples&&staples.length){ t+='\nCHECK PANTRY FIRST\n'; staples.forEach(x=>t+=`- ${x.name}: ${x.qtyText}\n`); }
  return t;
}
