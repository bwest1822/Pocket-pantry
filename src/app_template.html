<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Pantry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one-screen phone app, sticky header, scrolling panel, bottom tab bar */
  --bg:#f2f5f0; --surface:#ffffff; --ink:#1b2a22; --muted:#5f6f66; --line:#dfe6df;
  --basil:#2f7a4c; --basil-soft:#e2f0e6; --mustard:#d99a1e; --mustard-soft:#fbf0d6; --tomato:#c8462f; --tomato-soft:#f8e3de;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111813; --surface:#1a231d; --ink:#e8efe9; --muted:#9aab9f; --line:#2b372f;
  --basil:#6cc08b; --basil-soft:#1f3527; --mustard:#f0b94a; --mustard-soft:#3a2f17; --tomato:#ee7b63; --tomato-soft:#3d221d; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111813; --surface:#1a231d; --ink:#e8efe9; --muted:#9aab9f; --line:#2b372f;
  --basil:#6cc08b; --basil-soft:#1f3527; --mustard:#f0b94a; --mustard-soft:#3a2f17; --tomato:#ee7b63; --tomato-soft:#3d221d; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
header{padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;background:var(--bg);display:flex;align-items:center;gap:10px}
header h1{font:800 24px/1 var(--display);margin:0;letter-spacing:-.02em;flex:1}
header h1 span{color:var(--basil)}
.sync{font-size:12px;color:var(--muted)}
main{flex:1;overflow-y:auto;padding:0 16px 24px}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
nav.tabs button{background:none;border:0;padding:6px 0;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--basil);background:var(--basil-soft)}
h2{font:800 22px/1.15 var(--display);margin:8px 0 4px;text-wrap:balance;letter-spacing:-.01em}
h3{font:700 15px/1.3 var(--body);margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--muted);margin:0 0 12px;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:999px;font-weight:600;font-size:14px}
.btn.primary{background:var(--basil);border-color:var(--basil);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0e1a12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0e1a12}}
.btn.small{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stack{display:flex;flex-direction:column;gap:10px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--basil-soft);color:var(--basil);white-space:nowrap}
.chip.m{background:var(--mustard-soft);color:var(--mustard)}
.chip.t{background:var(--tomato-soft);color:var(--tomato)}
.chip.g{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
/* plan */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stat b{font:800 22px/1 var(--display);display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,var(--basil));border-radius:var(--radius);padding:10px 10px 10px 12px}
.day .dname{font:800 15px/1 var(--display)}
.day .dname small{display:block;font:600 10px/1.3 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.day .meal{font-weight:700;line-height:1.25;background:none;border:0;padding:0;text-align:left}
.day .meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.day select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 4px;font-size:12px;max-width:96px}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.settings label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.settings select,.settings input[type=number]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.tog[aria-pressed="true"]{background:var(--basil);border-color:var(--basil);color:#fff}
/* recipes */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;margin:6px 0 8px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.rgrid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.rgrid{grid-template-columns:1fr 1fr}}
.rc{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:left;width:100%}
.rc .sw{width:10px;align-self:stretch;border-radius:6px;background:var(--c,var(--basil));flex:none}
.rc b{display:block;line-height:1.25}
.rc .meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.star{color:var(--mustard)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,14,.45);display:none;z-index:20}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;background:var(--surface);border-radius:20px 20px 0 0;z-index:21;display:none;flex-direction:column;max-width:720px;margin:0 auto}
.sheet.open{display:flex}
.sheet .sh-head{padding:14px 16px 8px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line)}
.sheet .sh-head h2{flex:1;margin:0}
.sheet .sh-body{overflow-y:auto;padding:12px 16px calc(env(safe-area-inset-bottom) + 20px)}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ing li .q{min-width:92px;font-weight:700;font-variant-numeric:tabular-nums}
.ing li.pantry{color:var(--muted)}
ol.steps{padding-left:22px;margin:0}
ol.steps li{margin-bottom:10px}
.note{background:var(--mustard-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
.scale{display:flex;align-items:center;gap:8px;margin:6px 0 4px}
.scale b{font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
/* list */
.gsec{margin-top:14px}
.gsec h3{display:flex;justify-content:space-between;margin:0 0 6px}
.gitem{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
.gitem input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--basil)}
.gitem .nm{font-weight:600}
.gitem .uses{font-size:12px;color:var(--muted)}
.gitem .qty{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
.gitem.done .nm,.gitem.done .qty{text-decoration:line-through;color:var(--muted)}
.havebtn{border:0;background:none;color:var(--basil);font-size:12px;font-weight:700;padding:2px 0}
details.card summary{font-weight:700;cursor:pointer}
/* pantry */
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;border:2px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;background:var(--surface)}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 6px 5px 12px;font-size:14px}
.pchip button{border:0;background:var(--bg);border-radius:50%;width:22px;height:22px;line-height:1;padding:0;color:var(--muted)}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.miss{font-size:12px;color:var(--tomato)}
.answer{white-space:pre-wrap;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
textarea{width:100%;min-height:160px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.tonight{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:2px solid var(--basil);border-radius:var(--radius);padding:14px;margin:8px 0}
.tonight>b{font:800 20px/1.2 var(--display);text-wrap:balance}
.budget .stat b{font-size:18px}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--basil)}
.kidsplate{font-size:13px;background:var(--basil-soft);border-radius:10px;padding:8px 10px;margin-top:4px}
.banner{background:var(--mustard-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.chk{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px;cursor:pointer}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--basil)}
.chk.done span{text-decoration:line-through;color:var(--muted)}
.day.today{box-shadow:0 0 0 2px var(--basil)}
.kpgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kp{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 10px;font-weight:700;font-size:15px;min-height:72px;text-align:center}
.kp:active{border-color:var(--basil);background:var(--basil-soft)}
.cookmode{position:fixed;inset:0;background:var(--surface);z-index:30;display:none;flex-direction:column}
.cookmode.open{display:flex}
.cm-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;border-bottom:1px solid var(--line)}
.cm-head b{display:block;font:800 18px/1.2 var(--display)}
.cm-body{flex:1;overflow-y:auto;padding:16px}
.cm-step{font:600 26px/1.35 var(--body);margin:10px 0 18px;text-wrap:pretty}
.cm-foot{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line)}
.cm-foot .btn{padding:16px;font-size:17px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Pocket<span>Pantry</span></h1>
  <span class="sync" id="sync">Saved on this device</span>
</header>
<main id="main"></main>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="plan" id="tab-plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
  <button role="tab" data-tab="recipes" id="tab-recipes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h13"/><path d="M9 7h6"/></svg>Recipes</button>
  <button role="tab" data-tab="list" id="tab-list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>Grocery</button>
  <button role="tab" data-tab="pantry" id="tab-pantry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M5 10h14M8 6v1M8 13v3"/></svg>Pantry</button>
</nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="sh-head"><h2 id="shTitle"></h2><button class="iconbtn" id="shClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="sh-body" id="shBody"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="recipe-data" type="application/json">__RECIPES__</script>
<script>
(function(){
"use strict";
const BUILTIN = JSON.parse(document.getElementById('recipe-data').textContent);
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYFULL = {Sun:'Sunday',Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday'};
const TYPES = ['Easy','Crockpot','Big Cook','Grill','Fun','Off'];
const TYPE_COLOR = {'Easy':'var(--basil)','Crockpot':'var(--mustard)','Big Cook':'var(--tomato)','Grill':'#7a5cc7','Fun':'#2a8fb5','Off':'var(--line)'};
const CAT_COLOR = {'Crockpot':'var(--mustard)','Weeknight':'var(--basil)','Sheet Pan':'#2a8fb5','Big Cook':'var(--tomato)','Prep Day':'#5f6f66','Breakfast':'#e08a2e','Breakfast for Dinner':'#e08a2e','Blackstone':'#7a5cc7','Traeger':'#8a4b2a','My Recipes':'#c04a8a','From Friends':'#c04a8a','Lunch':'#3f8f8a','Snack':'#b5762a','Holiday':'#a0442f'};
const CAT_ORDER = ['Crockpot','Weeknight','Sheet Pan','Blackstone','Traeger','Big Cook','Prep Day','Breakfast','Breakfast for Dinner','Lunch','Snack','Holiday'];
const SECTIONS = ['Produce','Meat','Deli','Dairy','Bakery','Bread & Grains','Pasta & Sauce','Canned Goods','Soups & Mixes','International','Condiments','Baking','Spices','Snacks','Frozen','Beverages','Other'];
const DEFAULT_TYPES = {Sun:'Big Cook',Mon:'Easy',Tue:'Crockpot',Wed:'Easy',Thu:'Grill',Fri:'Fun',Sat:'Crockpot'};

/* ---------- state ---------- */
const LS_KEY='pocketpantry.v1';
function fresh(){return {household:4,lunches:1,kidMode:true,assumeStaples:true,equip:{crockpot:true,blackstone:true,traeger:true},
  plan:{days:DAYS.map(d=>({day:d,type:DEFAULT_TYPES[d],id:null,mult:null})),prep:[],breakfast:[]},
  pantry:[],have:{},checked:{},favs:{},custom:[],cooked:[],bought:{},kids:['Kid 1','Kid 2'],trips:[],prepDone:{},dinnerTime:'18:00',leftoverNight:true,autoWeek:true,family:null};}
let S = fresh();
try{const raw=localStorage.getItem(LS_KEY); if(raw) S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
let friendFavs=new Set();
let dbReady=false; let db=null, userId=null, userNs=null, sampleFn=null, shared=[]; let saveTimer=null, saving=false, dirty=false;
function persist(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
  if(!db||!userId||!dbReady) return;
  dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(saving||!dirty) return; saving=true; dirty=false;
  try{ await db.collection('data/users/'+userId).doc('state').set({json:JSON.stringify(S),t:Date.now()}); if(S.family){ try{ await writeFamily(); setSync('Synced with family'); }catch(e){ setSync('Family sync failed'); } } else setSync('Synced to your account'); }
  catch(e){ setSync('Saved on this device'); }
  saving=false; if(dirty) flush();
}
function setSync(t){document.getElementById('sync').textContent=t;}

/* ---------- recipes & normalizing ---------- */
const STOP=new Set(['boneless','skinless','lean','low-sodium','fresh','large','small','medium','packed','thin-sliced','thinly','sliced','diced','minced','chopped','raw','fully','optional','for','the','a','of','and','or','plus','to','serve','serving','topping','toppings','store-bought','cold','old-fashioned','oil-packed','grated','finely','softened','cubed','drained','rinsed','mild','dry','whole','thick','bite-size','frozen','refrigerated','uncooked','long-grain','bone-in','crushed']);
function sing(w){ if(w.length>3 && /ies$/.test(w)) return w.slice(0,-3)+'y'; if(w.length>3 && /oes$/.test(w)) return w.slice(0,-2); if(w.length>3 && /[^s]s$/.test(w)) return w.slice(0,-1); return w; }
function toks(s){ return s.toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^a-z0-9/ -]/g,' ').split(/\s+/).filter(w=>w&&!STOP.has(w)).map(sing); }
const KEYRULES=[
 [/cooked.*chicken|chicken.*cooked|leftover.*chicken/,'cooked chicken'],[/cooked rice|cooked.*rice/,'cooked rice'],
 [/ground beef|ground turkey|hamburger/,'ground beef'],[/chicken breast/,'chicken breasts'],[/chicken thigh/,'chicken thighs'],[/chicken tender/,'chicken tenders'],[/drumstick|chicken wing/,'chicken drumsticks or wings'],
 [/breakfast sausage/,'breakfast sausage'],[/italian.*sausage/,'Italian sausage'],[/chicken sausage/,'chicken sausage'],
 [/chuck roast/,'chuck roast'],[/pork shoulder|pork butt/,'pork shoulder'],[/pork tenderloin/,'pork tenderloin'],[/shaved steak|ribeye/,'shaved steak'],
 [/marinara|pizza sauce/,'marinara / pizza sauce'],[/alfredo/,'Alfredo sauce'],[/salsa verde/,'salsa verde'],[/salsa/,'mild salsa'],
 [/cheddar|mexican blend|monterey jack/,'shredded cheddar'],[/mozzarella/,'shredded mozzarella'],[/parmesan/,'Parmesan'],[/provolone|swiss|white american/,'sliced provolone'],[/american cheese|cheddar cheese slices|american or cheddar/,'American cheese slices'],
 [/cream cheese/,'cream cheese'],[/sour cream/,'sour cream'],[/ricotta/,'ricotta'],[/yogurt/,'vanilla yogurt'],[/egg noodle/,'egg noodles'],[/^eggs?$|^egg /,'eggs'],[/milk/,'milk'],[/butter/,'butter'],
 [/breadcrumb|bread crumb/,'breadcrumbs'],[/rice or mashed potatoes|mashed potato/,'mashed potatoes (pouch)'],[/large tortilla|tortillas or rice/,'large flour tortillas'],[/tortilla chip/,'tortilla chips'],[/tortilla/,'small tortillas'],[/hoagie/,'hoagie rolls'],[/hawaiian roll/,'Hawaiian rolls'],[/slider bun/,'slider buns'],[/bun/,'buns'],[/naan/,'naan'],[/bread|texas toast/,'bread'],
 [/russet|potatoes/,'potatoes'],[/hash brown/,'frozen hash browns'],[/tater tot|fries or tots/,'frozen fries / tots'],
 [/green bean/,'green beans'],[/broccoli/,'broccoli'],[/peas and carrots/,'frozen peas & carrots'],[/frozen peas|^peas/,'frozen peas'],[/mixed vegetables|mixed veg/,'frozen mixed vegetables'],[/stir-fry/,'frozen stir-fry veggies'],[/black beans/,'black beans'],[/corn on the cob/,'corn on the cob'],[/corn/,'corn'],
 [/yellow onion|^onions?$/,'yellow onions'],[/garlic powder/,'garlic powder'],[/garlic/,'garlic'],[/bell pepper|green bell/,'bell peppers'],[/lime/,'limes'],[/baby carrot|carrots/,'carrots'],[/spinach/,'baby spinach'],[/banana/,'bananas'],[/berries|blueberries/,'berries'],
 [/chicken broth/,'chicken broth'],[/beef broth/,'beef broth'],[/taco seasoning|fajita/,'taco seasoning'],[/ranch seasoning/,'ranch seasoning packet'],[/au jus/,'au jus mix'],[/onion soup mix/,'onion soup mix'],[/cream of chicken/,'cream of chicken soup'],[/cream of mushroom/,'cream of mushroom soup'],
 [/italian seasoning/,'Italian seasoning'],[/soy sauce/,'soy sauce'],[/bbq sauce/,'BBQ sauce'],[/pepperoncini/,'pepperoncini'],[/panko|crushed crackers/,'panko'],[/breadcrumb/,'breadcrumbs'],[/honey/,'honey'],[/oats/,'oats'],[/pancake mix/,'pancake mix'],[/maple syrup/,'maple syrup'],
 [/^rice$|rice \(|^rice /,'rice'],[/elbow/,'elbow macaroni'],[/egg noodle/,'egg noodles'],[/spaghetti/,'spaghetti'],[/penne|rotini|ziti|short pasta|fettuccine/,'short pasta'],[/^pasta|lasagna/,'pasta']
];
function keyOf(item){ const s=item.toLowerCase().replace(/\(.*?\)/g,' ').trim(); for(const [re,k] of KEYRULES){ if(re.test(s)) return k; } return toks(item).join(' ')||s; }
function normUnit(u){ u=(u||'').trim(); u=u.replace(/^(jar|can|carton|bag|pack|packet|box|bottle|tub|head)s\b/,'$1'); if(u==='cups')return 'cup'; if(u==='lbs')return 'lb'; return u; }
const COUNT_UNIT=/^$|^(jar|can|carton|bag|pack|packet|box|bottle|tub|head|bunch|sleeve|pouch|slices|cloves|stalks|clove|slice)\b/;
function prep(r,src){
  r.ingredients=(r.ingredients||[]).map(i=>Object.assign({},i,{unit:normUnit(i.unit),key:keyOf(i.item||''),opt:/optional/i.test(i.item||'')}));
  r.tags=r.tags||[]; r.kid=r.tags.includes('kid-friendly'); r.src=src; r.night=r.night||(r.category==='Crockpot'?'Crockpot':'Easy');
  return r;
}
BUILTIN.forEach(r=>{ r.ingredients=r.ingredients.map(i=>Array.isArray(i)?{qty:i[0],unit:i[1],item:i[2],section:i[3],pantry:!!i[4]}:i); prep(r,'builtin'); });
function allRecipes(){ return BUILTIN.concat(S.custom.map(r=>prep(r,'mine')), shared.map(r=>prep(r,'friend'))); }
function byId(id){ return allRecipes().find(r=>r.id===id); }
function planRecipes(){ return allRecipes().filter(r=>r.src!=='friend'); }
function equipOK(r){ if(r.category==='Crockpot'&&!S.equip.crockpot)return false; if(r.category==='Blackstone'&&!S.equip.blackstone)return false; if(r.category==='Traeger'&&!S.equip.traeger)return false; return true; }
function isDinner(r){ return !['Breakfast','Prep Day','Lunch','Snack'].includes(r.category) && !r.tags.includes('side') && !r.tags.includes('appetizer'); }

/* ---------- formatting ---------- */
function frac(n){ if(n==null||isNaN(n)) return ''; const w=Math.floor(n+1e-6), f=n-w; const map=[[0,''],[.25,'¼'],[.33,'⅓'],[.5,'½'],[.67,'⅔'],[.75,'¾'],[1,'']]; let best=map[0],d=9; for(const m of map){const dd=Math.abs(f-m[0]); if(dd<d){d=dd;best=m;}} let whole=w+(best[0]===1?1:0); const s=(whole?whole:'')+best[1]; return s||'0'; }
function roundQty(q,unit){ if(COUNT_UNIT.test(unit)) return Math.max(1,Math.ceil(q-0.05)); return Math.round(q*4)/4||0.25; }
function qtyStr(q,unit){ const n=frac(q); if(!unit) return n; return n+' '+unit; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1800); }

/* ---------- scaling ---------- */
function dinnerFactor(r,d){ if(d&&d.mult) return d.mult; const two=d&&d.day&&feedsTwo(d); if(!r.servings) return two?2:1; const target=S.household+S.lunches+(two?S.household:0); const f=target/(r.servings||4); return Math.max(0.5,Math.round(f*4)/4); }
function servingsFor(r,f){ return r.servings?Math.round(r.servings*f):null; }
function yieldText(r,f){ const n=servingsFor(r,f); if(n!=null) return n+' servings'; return f===1?'as written':'×'+frac(f)+' batch'; }

/* ---------- pantry matching ---------- */
function pantryHas(key){
  const kt=toks(key); if(!kt.length) return false;
  return S.pantry.some(p=>{ const pt=toks(p); if(!pt.length) return false; const pk=keyOf(p); if(pk===key) return true;
    return pt.every(w=>kt.includes(w)) || kt.every(w=>pt.includes(w)); });
}

/* ---------- auto planner ---------- */
const MAIN_PROT=r=>{ const k=r.ingredients.find(i=>i.section==='Meat'); return k?k.key.split(' ').slice(-1)[0]:'veg'; };
function candidates(type){
  const all=planRecipes().filter(r=>isDinner(r)&&equipOK(r)&&!(S.kidMode&&r.tags.includes('spicy')));
  switch(type){
    case 'Easy': return all.filter(r=>r.night==='Easy'&&!['Crockpot'].includes(r.category));
    case 'Crockpot': return S.equip.crockpot? all.filter(r=>r.category==='Crockpot') : all.filter(r=>r.night==='Easy');
    case 'Big Cook': return all.filter(r=>r.night==='Big Cook'||r.tags.includes('makes leftovers')&&r.category!=='Crockpot');
    case 'Grill': { const g=all.filter(r=>r.category==='Blackstone'||r.category==='Traeger'); return g.length?g:all.filter(r=>r.category==='Sheet Pan'); }
    case 'Fun': return all.filter(r=>r.tags.some(t=>['fun night','build-your-own','pizza','burgers','finger food'].includes(t)));
    default: return [];
  }
}
function planKeys(excludeIdx){ const ks=new Set(); S.plan.days.forEach((d,i)=>{ if(i===excludeIdx||!d.id) return; const r=byId(d.id); if(r) r.ingredients.forEach(x=>{ if(!x.pantry&&!/^cooked/.test(x.key)) ks.add(x.key); }); }); return ks; }
function score(r,keys,used,prevProt,makesChicken){
  let s=0; r.ingredients.forEach(x=>{ if(!x.pantry&&keys.has(x.key)) s+=2; if(!x.pantry&&pantryHas(x.key)) s+=1.5; });
  if(S.kidMode&&r.kid) s+=2.5; if(S.favs[r.id]) s+=3; s+=kidScore(r); if(used.has(r.id)) s-=100;
  if(prevProt&&MAIN_PROT(r)===prevProt) s-=2;
  if(r.ingredients.some(x=>x.key==='cooked chicken')) s+= makesChicken?3:-1;
  return s+Math.random()*3;
}
function pickFor(i){
  const d=S.plan.days[i]; d.cooked=false; d.cookedRef=null; d.pickedBy=null; if(d.type==='Off'){d.id=null;return;}
  const cands=candidates(d.type); if(!cands.length){d.id=null;return;}
  const keys=planKeys(i); const used=new Set(S.plan.days.filter((x,j)=>j!==i&&x.id).map(x=>x.id));
  const prev=i>0&&S.plan.days[i-1].id?byId(S.plan.days[i-1].id):null; const prevProt=prev?MAIN_PROT(prev):null;
  const makesChicken=S.plan.days.some((x,j)=>j<i&&x.id&&(byId(x.id)||{tags:[]}).tags.includes('makes leftovers'))||S.plan.prep.includes('prep-shredded-chicken');
  const ranked=cands.map(r=>[score(r,keys,used,prevProt,makesChicken),r]).sort((a,b)=>b[0]-a[0]);
  d.id=ranked[0][1].id; d.mult=null;
}
function autoExtras(){
  const ids=S.plan.days.filter(d=>d.id).map(d=>byId(d.id)).filter(Boolean);
  const needs=k=>ids.some(r=>r.ingredients.some(x=>x.key===k));
  const prepSet=new Set(S.plan.prep.filter(id=>!['prep-shredded-chicken','prep-rice'].includes(id)));
  if(needs('cooked chicken')) prepSet.add('prep-shredded-chicken');
  if(needs('cooked rice')) prepSet.add('prep-rice');
  S.plan.prep=[...prepSet].filter(id=>byId(id));
  if(S.plan.breakfast.length===0){
    const keys=planKeys(-1); const bk=planRecipes().filter(r=>r.category==='Breakfast');
    const pick=(list)=>list.map(r=>[ (r.ingredients.filter(x=>keys.has(x.key)).length*2)+(r.kid?2:0)+Math.random()*3,r]).sort((a,b)=>b[0]-a[0])[0];
    const a=pick(bk.filter(r=>r.night==='Prep Day')); const b=pick(bk.filter(r=>r.night!=='Prep Day'));
    S.plan.breakfast=[a&&a[1].id,b&&b[1].id].filter(Boolean);
  }
  const leftovers=ids.some(r=>r.tags.includes('makes leftovers'))||S.plan.prep.includes('prep-shredded-chicken');
  [['lunch','Lunch'],['snacks','Snack']].forEach(([k,cat])=>{ if(Array.isArray(S.plan[k])) return;
    const pool=planRecipes().filter(r=>r.category===cat).map(r=>[(r.kid?2:0)+(S.favs[r.id]?3:0)+((k==='lunch'&&leftovers&&r.tags.includes('uses leftovers'))?3:0)+(r.ingredients.filter(x=>planKeys(-1).has(x.key)).length)+Math.random()*3,r]).sort((a,b)=>b[0]-a[0]);
    S.plan[k]=pool.slice(0,2).map(x=>x[1].id); });
}
function autoPlan(silent){ S.plan.days.forEach((d,i)=>{d.id=null;d.mult=null;d.feeds2=false;d.leftFrom=null;d.pickedBy=null; d.type=d.type==='Off'?DEFAULT_TYPES[d.day]:d.type;}); S.plan.breakfast=[]; S.plan.prep=[]; delete S.plan.lunch; delete S.plan.snacks; S.plan.sides=[]; S.prepDone={};
  for(let i=0;i<7;i++) pickFor(i);
  if(S.leftoverNight!==false){ const ok=(d,j)=>{ const r=j<6&&d.id&&byId(d.id); return r&&['Big Cook','Crockpot'].includes(d.type)&&!/breakfast/i.test(r.category+' '+r.tags.join(' ')); }; let i=S.plan.days.findIndex((d,j)=>ok(d,j)&&(byId(d.id).tags.includes('makes leftovers')||byId(d.id).category==='Crockpot')); if(i<0) i=S.plan.days.findIndex(ok); if(i>=0){ const n=S.plan.days[i+1]; S.plan.days[i].feeds2=true; n.type='Off'; n.id=null; n.leftFrom=i; } }
  autoExtras(); S.checked={}; S.bought={}; S.weekOf=S.viewing==='next'?nextWeekKey():weekKey(); persist(); render(); if(!silent) toast('New week planned'); }

/* ---------- grocery ---------- */
function planItems(){
  const out=[]; S.plan.days.forEach(d=>{ if(!d.id) return; const r=byId(d.id); if(r) out.push({r,f:dinnerFactor(r,d),label:d.day}); });
  S.plan.prep.forEach(id=>{const r=byId(id); if(r) out.push({r,f:1,label:'Prep'});});
  ['breakfast','lunch','snacks','sides'].forEach(k=>(S.plan[k]||[]).forEach(id=>{const r=byId(id); if(r) out.push({r,f:1,label:k});}));
  return out;
}
function grocery(){
  const items=planItems(); const madePrep=new Set(); items.filter(x=>x.label==='Prep').forEach(x=>{ if(x.r.id==='prep-shredded-chicken') madePrep.add('cooked chicken'); if(x.r.id==='prep-rice'){madePrep.add('cooked rice');} });
  const map=new Map();
  items.forEach(({r,f})=>{ r.ingredients.forEach(x=>{
    if(madePrep.has(x.key)) return;
    let key=x.key, section=x.section||'Other';
    if(key==='cooked chicken'){ section='Meat'; }
    if(!map.has(key)) map.set(key,{key,name:key==='cooked chicken'?'cooked chicken (rotisserie works)':key,section,pantry:!!x.pantry,amts:{},uses:new Set(),optional:true});
    const g=map.get(key); g.pantry=g.pantry&&!!x.pantry; if(!x.opt) g.optional=false; if(!SECTIONS.includes(g.section)) g.section='Other';
    const u=x.unit||''; g.amts[u]=(g.amts[u]||0)+x.qty*f; g.uses.add(r.name);
  });});
  const list=[...map.values()].map(g=>{ g.qtyText=Object.entries(g.amts).map(([u,q])=>qtyStr(roundQty(q,u),u)).join(' + '); g.have=!!S.have[g.key]||pantryHas(g.key); return g; });
  return list;
}

/* ---------- render ---------- */

const main=document.getElementById('main');
function setTab(t){ tab=t; try{ if(location.hash!=='#'+t) history.replaceState(null,'','#'+t);}catch(e){} render(); main.scrollTop=0; }
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]'); if(b) setTab(b.dataset.tab);});
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1); if(['plan','recipes','list','pantry'].includes(t)&&t!==tab){tab=t;render();}});
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab?'true':'false'));
  ({plan:renderPlan,recipes:renderRecipes,list:renderList,pantry:renderPantry})[tab]();
}

  main.innerHTML=h;

function renderList(){
  const g=grocery(); S.bought=S.bought||{}; applyBought(g);
  const bought=g.filter(x=>S.bought[x.key]&&!x.boughtPart);
  const notBought=x=>!S.bought[x.key]||x.boughtPart;
  const toBuy=g.filter(x=>!x.have&&!(x.pantry&&S.assumeStaples)&&notBought(x));

  if(inCart.length){ h+=`<details class="card" style="margin-top:16px"><summary>In the cart: ${inCart.length}</summary><p class="muted" style="font-size:13px">Uncheck an item to put it back on the list.</p>${inCart.map(x=>itemRow(x,true)).join('')}</details>`; }
  if(staples.length){ h+=`<details class="card" style="margin-top:10px"><summary>Check you have: ${staples.length} staples</summary><p class="muted" style="font-size:13px">Spices, oils and condiments. Tap “Have it” or check to add to the cart.</p>${staples.map(x=>itemRow(x,true)).join('')}</details>`; }

  main.querySelectorAll('[data-have]').forEach(b=>b.onclick=()=>{ S.have[b.dataset.have]=true; persist(); renderList(); toast('Moved to Already have'); });
  main.querySelectorAll('[data-need]').forEach(b=>b.onclick=()=>{ const k=b.dataset.need; delete S.have[k]; S.pantry=S.pantry.filter(p=>{const pk=keyOf(p); const pt=toks(p), kt=toks(k); return !(pk===k||pt.every(w=>kt.includes(w))||kt.every(w=>pt.includes(w)));}); persist(); renderList(); });
  const bb=main.querySelector('#bought'); if(bb) bb.onclick=()=>openTrip(()=>{ g.forEach(x=>{ if(!x.have) S.bought[x.key]=Object.assign({}, (typeof S.bought[x.key]==='object'?S.bought[x.key]:{}), x.fullAmts||x.amts); }); S.checked={}; main.scrollTop=0; });
  main.querySelectorAll('[data-gweek]').forEach(b=>b.onclick=()=>switchWeek(b.dataset.gweek));
  const lt=main.querySelector('#logTrip'); if(lt) lt.onclick=()=>openTrip(null);
  main.querySelectorAll('[data-unbuy]').forEach(b=>b.onclick=()=>{ delete S.bought[b.dataset.unbuy]; persist(); renderList(); });
  const ub=main.querySelector('#unbuyAll'); if(ub) ub.onclick=()=>{ S.bought={}; persist(); renderList(); toast('List restored'); };
  main.querySelector('#copy').onclick=()=>copyText(listText(toBuy,staples),'List copied');
  main.querySelector('#order').onclick=openOrder;
  main.querySelector('#clr').onclick=()=>{S.checked={}; persist(); renderList();};
}
// Items marked bought stay off the list unless the week now needs more of them.
function applyBought(g){
  g.forEach(x=>{ const b=S.bought[x.key]; if(!b) return; x.fullAmts=Object.assign({},x.amts);
    if(b===true) return;
    const extra={}; Object.entries(x.amts).forEach(([u,q])=>{ const d=q-(b[u]||0); if(d>0.05) extra[u]=d; });
    if(Object.keys(extra).length){ x.amts=extra; x.qtyText=Object.entries(extra).map(([u,q])=>qtyStr(roundQty(q,u),u)).join(' + ')+' more'; x.boughtPart=true; } });
}
function itemRow(x,buy){
  const chk=!!S.checked[x.key];
  return `<div class="gitem${chk&&buy?' done':''}">${buy?`<input type="checkbox" id="c-${esc(x.key)}" data-chk="${esc(x.key)}"${chk?' checked':''} aria-label="${esc(x.name)}">`:'<span></span>'}
  <label for="c-${esc(x.key)}"><span class="nm">${esc(x.name)}${x.optional?' <span class="chip g">optional</span>':''}</span><div class="uses">${[...x.uses].map(esc).join(' · ')}</div>
  ${buy?`<button class="havebtn" data-have="${esc(x.key)}">Have it</button>`:`<button class="havebtn" data-need="${esc(x.key)}">Need it</button>`}</label>
  <span class="qty">${esc(x.qtyText)}</span></div>`;
}
function listText(toBuy,staples){
  let t='Pocket Pantry grocery list\n';
  SECTIONS.forEach(sec=>{ const it=toBuy.filter(x=>x.section===sec&&!S.checked[x.key]); if(!it.length) return; t+=`\n${sec.toUpperCase()}\n`; it.forEach(x=>t+=`- ${x.name}: ${x.qtyText}${x.optional?' (optional)':''}\n`); });
  if(staples&&staples.length){ t+='\nCHECK PANTRY FIRST\n'; staples.forEach(x=>t+=`- ${x.name}: ${x.qtyText}\n`); }
  return t;
}
async function copyText(t,msg){ try{ await navigator.clipboard.writeText(t); toast(msg); }catch(e){ openSheet('Copy your list',`<p class="muted">Select all and copy:</p><textarea id="cpy" readonly>${esc(t)}</textarea>`); const ta=document.getElementById('cpy'); ta.focus(); ta.select(); } }
function openOrder(){
  const g=grocery(); S.bought=S.bought||{}; applyBought(g); const toBuy=g.filter(x=>!x.have&&!(x.pantry&&S.assumeStaples)&&(!S.bought[x.key]||x.boughtPart));
  const msg='Compare prices for this grocery list at Kroger and Walmart, tell me which has everything and which is cheaper, then add it to the cart I pick in my Chrome browser. Don\'t check out.\n\n'+listText(toBuy,[]);

  <ol class="steps"><li>Tap <b>Copy request</b>.</li><li>Open a chat with Claude on a computer that has Chrome and the Claude extension running.</li><li>Paste and send.</li></ol>
  <button class="btn primary" id="cpReq">Copy request</button><p class="muted" style="font-size:13px;margin-top:14px">Kroger and Walmart don't let other apps import shopping lists, so Claude adds each item for you.</p>`);
  document.getElementById('cpReq').onclick=()=>copyText(msg,'Request copied. Paste it into Claude.');
}

/* ---------- pantry ---------- */
let scanState={busy:false,found:[],err:'',ideas:'',ideasBusy:false};
function renderPantry(){
  const canAsk=!!sampleFn;
  let h=`<h2>Pantry &amp; fridge</h2><p class="sub">Anything listed here comes off your grocery list and helps pick meals.</p>
  <div class="drop"><b>Snap your fridge or pantry</b><span class="muted" style="font-size:14px">${canAsk?'Take a photo and Claude lists what it sees.':'Type what you have below. Photo scanning is in the Claude version of Pocket Pantry.'}</span>
  <label class="btn primary" for="snap" ${canAsk?'':'hidden'}>${scanState.busy?'Looking…':'Take or choose a photo'}</label>
  <input type="file" id="snap" accept="image/*" capture="environment" style="position:absolute;left:-9999px" ${canAsk&&!scanState.busy?'':'disabled'}>
  ${scanState.err?`<span class="miss">${esc(scanState.err)}</span>`:''}</div>`;
  if(scanState.found.length){ h+=`<div class="card" style="margin-top:10px"><b>Found ${scanState.found.length} items</b><p class="muted" style="font-size:13px;margin:4px 0 8px">Tap any to remove before adding.</p><div class="pchips">${scanState.found.map((f,i)=>`<span class="pchip">${esc(f)}<button data-rmf="${i}" aria-label="Remove ${esc(f)}">×</button></span>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn primary" id="addFound">Add all to pantry</button><button class="btn" id="discard">Discard</button></div></div>`; }
  h+=`<h3>What you have (${S.pantry.length})</h3><div class="pchips">${S.pantry.map((p,i)=>`<span class="pchip">${esc(p)}<button data-rmp="${i}" aria-label="Remove ${esc(p)}">×</button></span>`).join('')||'<span class="muted">Nothing yet.</span>'}</div>
  <form class="addrow" id="addP"><label for="pin" style="position:absolute;left:-9999px">Add an item</label><input id="pin" placeholder="Add an item, e.g. chicken breasts" autocomplete="off"><button class="btn" type="submit">Add</button></form>
  <div class="row" style="margin-top:8px"><button class="btn small" id="clrP">Clear pantry</button><button class="tog" aria-pressed="${S.assumeStaples}" id="staples">I keep spices &amp; staples stocked</button></div>
  <h3>What can I make right now?</h3>`;
  const opts=allRecipes().filter(r=>isDinner(r)&&equipOK(r)).map(r=>{ const miss=r.ingredients.filter(x=>!x.opt&&!(x.pantry&&S.assumeStaples)&&!pantryHas(x.key)&&!S.have[x.key]); return {r,miss}; }).filter(o=>o.miss.length<=3).sort((a,b)=>a.miss.length-b.miss.length||((b.r.kid?1:0)-(a.r.kid?1:0)));
  if(!S.pantry.length) h+=`<p class="muted">Add a few items or snap a photo to see matches.</p>`;
  else if(!opts.length) h+=`<p class="muted">Nothing is within 3 items yet. Add more of what you have.</p>`;
  else { h+=`<div class="stack">`; opts.slice(0,12).forEach(o=>{ h+=`<button class="rc" data-open="${esc(o.r.id)}" style="--c:${o.miss.length?'var(--mustard)':'var(--basil)'}"><span class="sw"></span><span><b>${esc(o.r.name)}</b><span class="meta">${o.miss.length?`<span class="miss">Need: ${o.miss.map(m=>esc(m.key)).join(', ')}</span>`:'<span class="chip">You have everything</span>'}</span></span></button>`; }); h+=`</div>`; }
  if(canAsk&&S.pantry.length){ h+=`<div class="card" style="margin-top:12px"><b>Ask Claude for a quick idea</b><p class="muted" style="font-size:13px;margin:4px 0 8px">Ideas beyond the cookbook, from what's in your pantry.</p><button class="btn" id="ideas" ${scanState.ideasBusy?'disabled':''}>${scanState.ideasBusy?'Thinking…':'Give me 3 ideas'}</button>${scanState.ideas?`<div class="answer" style="margin-top:10px">${esc(scanState.ideas)}</div>`:''}</div>`; }
  main.innerHTML=h;
  const snap=main.querySelector('#snap'); if(snap) snap.onchange=()=>{ if(snap.files&&snap.files[0]) scanPhoto(snap.files[0]); };
  main.querySelectorAll('[data-rmf]').forEach(b=>b.onclick=()=>{scanState.found.splice(+b.dataset.rmf,1); renderPantry();});
  const af=main.querySelector('#addFound'); if(af) af.onclick=()=>{ addPantry(scanState.found); scanState.found=[]; renderPantry(); toast('Added to pantry'); };
  const di=main.querySelector('#discard'); if(di) di.onclick=()=>{scanState.found=[]; renderPantry();};
  main.querySelectorAll('[data-rmp]').forEach(b=>b.onclick=()=>{S.pantry.splice(+b.dataset.rmp,1); persist(); renderPantry();});
  main.querySelector('#addP').onsubmit=e=>{e.preventDefault(); const v=main.querySelector('#pin').value.trim(); if(v){ addPantry(v.split(',')); renderPantry(); main.querySelector('#pin').focus(); }};
  main.querySelector('#clrP').onclick=()=>{ if(!S.pantry.length) return; S.pantry=[]; persist(); renderPantry(); toast('Pantry cleared'); };
  main.querySelector('#staples').onclick=()=>{S.assumeStaples=!S.assumeStaples; persist(); renderPantry();};
  main.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openRecipe(b.dataset.open));
  const ib=main.querySelector('#ideas'); if(ib) ib.onclick=askIdeas;
}
function addPantry(arr){ arr.map(s=>String(s).trim().toLowerCase()).filter(Boolean).forEach(s=>{ if(!S.pantry.includes(s)) S.pantry.push(s); }); persist(); }
async function scanPhoto(file){
  scanState.busy=true; scanState.err=''; renderPantry();
  try{
    const lim=sampleFn.limits?await sampleFn.limits():{images:true};
    if(lim&&lim.images===false) throw {message:'Photo reading isn\'t available here.'};
    const res=await sampleFn.json('You are looking at a photo of a home fridge, freezer or pantry. List every food or grocery item you can identify. Use short generic grocery names a shopper would use (e.g. "chicken breasts", "shredded cheddar", "marinara sauce", "eggs", "tortillas", "milk", "butter", "frozen green beans"). No brands, no quantities, no guesses about things you cannot see. Return JSON: {"items":["..."]}',{images:[file],modelTier:'default'});
    const items=(res&&Array.isArray(res.items))?res.items:Array.isArray(res)?res:[];
    scanState.found=[...new Set(items.map(s=>String(s).toLowerCase().trim()).filter(Boolean))];
    if(!scanState.found.length) scanState.err='Couldn\'t spot any food. Try a brighter, closer photo.';
  }catch(e){ scanState.err= e&&e.code==='not_granted'?'Allow Claude access to use photo scanning.': e&&e.code==='rate_limited'?'Too many scans right now. Try again in a minute.':'Couldn\'t read that photo. Try again.'; }
  scanState.busy=false; renderPantry();
}
async function askIdeas(){
  scanState.ideasBusy=true; scanState.ideas=''; renderPantry();
  try{
    const prompt=`I'm cooking for ${S.household} people including picky young kids. Here's what I have: ${S.pantry.join(', ')}. Suggest 3 easy dinners I could make tonight mostly from these (assume salt, pepper, oil, and basic spices). For each: a name line, then one or two short sentences on how to make it, then a tip for picky kids. Plain text, no markdown symbols.`;
    const out=await sampleFn(prompt,{modelTier:'quick',onText:({text})=>{scanState.ideas=text; const el=main.querySelector('.answer'); if(el) el.textContent=text; else if(tab==='pantry') renderPantry();}});
    scanState.ideas=out.text;
  }catch(e){ scanState.ideas= e&&e.code==='rate_limited'?'Too many requests right now. Try again in a minute.':'Couldn\'t get ideas right now.'; }
  scanState.ideasBusy=false; if(tab==='pantry') renderPantry();
}

function openImport(){
  openSheet('Paste your data','<p class="muted">Paste the code from “Copy my data”. This replaces the plan, pantry, favorites and recipes here.</p><label for="impT" style="position:absolute;left:-9999px">Data code</label><textarea id="impT" placeholder="PP1:…"></textarea><div class="row" style="margin-top:10px"><button class="btn primary" id="impGo">Replace with this data</button><span id="impMsg" class="miss"></span></div>');
  document.getElementById('impGo').onclick=()=>{ try{ const v=document.getElementById('impT').value.trim().replace(/^PP1:/,''); const o=JSON.parse(decodeURIComponent(escape(atob(v)))); if(!o||!o.plan) throw 0; S=Object.assign(fresh(),o); persist(); closeSheet(); render(); toast('Your data is here'); }catch(e){ document.getElementById('impMsg').textContent='That code didn’t work. Copy it again and paste the whole thing.'; } };
}
function cookedHistory(r){
  const h=(S.cooked||[]).filter(c=>c.id===r.id); if(!h.length) return '';
  const last=h[h.length-1]; const kids={yes:'Kids liked it',no:'Kids weren’t fans',some:'Kids were so-so'};
  return `<div class="note" style="background:var(--basil-soft)"><b>Cooked ${h.length} time${h.length>1?'s':''}</b> · last ${esc(new Date(last.date).toLocaleDateString(undefined,{month:'short',day:'numeric'}))}${last.kidsBy&&Object.keys(last.kidsBy).length?' · '+Object.entries(last.kidsBy).map(([k,v])=>esc(k)+': '+({yes:'ate it',some:'some',no:'nope'})[v]).join(', '):last.kids?' · '+kids[last.kids]:''}${h.filter(c=>c.note).slice(-3).map(c=>`<div style="margin-top:6px">“${esc(c.note)}”</div>`).join('')}</div>`;
}
function openCooked(i){
  const d=S.plan.days[i]; const r=byId(d.id); if(!r) return;
  S.cooked=S.cooked||[];
  const prev=d.cookedRef!=null?S.cooked[d.cookedRef]:null;
  let fav=!!S.favs[r.id]; const kidsBy=Object.assign({}, prev&&prev.kidsBy||{});
  const draw=()=>{
    document.getElementById('shBody').innerHTML=`<p class="muted" style="margin-top:0">How did ${esc(r.name)} go?</p>
    <button class="btn ${fav?'primary':''}" id="cfav" aria-pressed="${fav}" style="width:100%;padding:14px;font-size:16px">${fav?'★ Saved to favorites':'☆ Save to favorites'}</button>
    <h3>Did the kids eat it?</h3>${kidsList().map(k=>`<div class="row" style="justify-content:space-between;margin-bottom:6px"><b>${esc(k)}</b><div class="toggles">${[['yes','Ate it'],['some','Some'],['no','Nope']].map(([v,l])=>`<button class="tog" aria-pressed="${kidsBy[k]===v}" data-kb="${esc(k)}|${v}">${l}</button>`).join('')}</div></div>`).join('')}
    <h3>Notes for next time</h3><label for="cnote" style="position:absolute;left:-9999px">Notes</label><textarea id="cnote" style="min-height:80px" placeholder="e.g. Double the sauce, cook on HIGH 3 hrs">${esc(prev?prev.note||'':'')}</textarea>

function feedsTwo(d){ const i=S.plan.days.indexOf(d); const n=S.plan.days[i+1]; return !!(d.feeds2&&n&&n.type==='Off'&&n.leftFrom===i); }

/* ---------- this week / next week ---------- */
function nextWeekKey(){ return weekKey(Date.now()+7*864e5); }
function weekRange(next){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()+(next?7:0)); const e=new Date(d); e.setDate(d.getDate()+6); const f=x=>x.toLocaleDateString(undefined,{month:'short',day:'numeric'}); return f(d)+' – '+f(e); }
function dayDate(i,next){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()+i+(next?7:0)); return d.toLocaleDateString(undefined,{month:'numeric',day:'numeric'}); }
function bundleOf(){ return {plan:S.plan,bought:S.bought,checked:S.checked,prepDone:S.prepDone,weekOf:S.weekOf}; }
function applyBundle(o){ S.plan=o.plan; S.bought=o.bought||{}; S.checked=o.checked||{}; S.prepDone=o.prepDone||{}; S.weekOf=o.weekOf; ['prep','breakfast'].forEach(k=>{ if(!Array.isArray(S.plan[k])) S.plan[k]=[]; }); }

/* ---------- cook times ---------- */
function parseDur(s){
  s=String(s||'').replace(/(\d)½/g,'$1.5').replace(/½/g,'0.5');
  let total=0,found=false; const re=/(\d+(?:\.\d+)?)(?:\s*[–-]\s*(\d+(?:\.\d+)?))?\s*(hr|hours?|h\b|min|minutes?)/gi; let m;
  while((m=re.exec(s))){ found=true; const v=parseFloat(m[2]||m[1]); total+=/^h/i.test(m[3])?v*60:v; }
  return found?total:null;
}
function cookOptions(cook){
  const parts=String(cook||'').split(/\bor\b/i); const out=[];
  parts.forEach(p=>{ const mins=parseDur(p); if(mins==null) return; const label=/HIGH/i.test(p)&&!/LOW/i.test(p)?'HIGH':(/LOW/i.test(p)?'LOW':''); out.push({label,mins}); });
  return out;
}
function fmtTime(ms){ return new Date(ms).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }
function startByText(r){
  const [hh,mm]=(S.dinnerTime||'18:00').split(':').map(Number); const din=new Date(); din.setHours(hh,mm,0,0);
  const opts=cookOptions(r.cook); if(!opts.length) return '';
  return opts.map(o=>`${fmtTime(din.getTime()-(o.mins+10)*60000)}${o.label?' on '+o.label:''}`).join(' · ');
}

function kidsList(){ return (S.kids&&S.kids.length?S.kids:['Kid 1','Kid 2']); }
function kidScore(r){ let s=0; (S.cooked||[]).filter(c=>c.id===r.id).forEach(c=>{ if(c.kidsBy) Object.values(c.kidsBy).forEach(v=>{ s+= v==='yes'?1:v==='no'?-1.5:0; }); else s+= c.kids==='yes'?2:c.kids==='no'?-2:0; }); return s; }
function kidsPlate(r){
  if(r.notes&&/kid|picky/i.test(r.notes)) return r.notes;
  const meat=r.ingredients.find(x=>x.section==='Meat'); const starch=r.ingredients.find(x=>['Pasta & Sauce','Bread & Grains'].includes(x.section)&&!/sauce|marinara/i.test(x.item));
  const parts=[meat&&('plain '+meat.key), starch&&starch.key].filter(Boolean);

/* ---------- protein estimate ---------- */
const PROT=[[/cooked chicken/,{cup:38,lb:120}],[/chicken (breast|tender)/,{lb:105,oz:6.5}],[/chicken thigh|drumstick|wing/,{lb:80}],[/whole chicken/,{lb:60}],[/ground beef/,{lb:77,oz:4.8}],[/italian sausage|breakfast sausage/,{lb:60}],[/chicken sausage/,{oz:4}],
 [/pork shoulder|pork butt/,{lb:75}],[/pork tenderloin/,{lb:95,'':110}],[/pork chop/,{lb:95,'':45}],[/chuck roast|sirloin|shaved steak|ribeye/,{lb:90}],[/turkey/,{lb:100}],[/meatball/,{'bag (24 oz)':70}],
 [/^eggs$/,{'':6}],[/shredded cheddar|shredded mozzarella/,{cup:28}],[/parmesan/i,{cup:38}],[/cream cheese/,{oz:2}],[/ricotta/,{cup:28,oz:3}],[/black beans|kidney|pinto|great northern|cannellini/,{'can (15 oz)':21,can:21}],
 [/greek yogurt|vanilla yogurt/,{cup:20}],[/^milk$/,{cup:8}],[/bacon/,{lb:55}],[/ham|deli turkey/,{cup:25,oz:5}],[/hot dog/,{'':6}],[/peanut butter/,{cup:64,tbsp:4}]];
function proteinOf(r){
  let g=0; r.ingredients.forEach(x=>{ const hit=PROT.find(([re])=>re.test(x.key)||re.test(x.item.toLowerCase())); if(!hit) return; const tbl=hit[1]; const u=x.unit||''; let per=tbl[u]; if(per==null&&/^can/.test(u)) per=tbl.can; if(per==null&&u==='oz'&&tbl.lb) per=tbl.lb/16; if(per==null&&u==='lb'&&tbl.oz) per=tbl.oz*16; if(per!=null) g+=per*x.qty; });
  if(!g) return null; return r.servings?{per:Math.round(g/r.servings),serv:true}:{per:Math.round(g),serv:false};
}
function proteinText(r){ const p=proteinOf(r); if(!p) return ''; return p.serv?`~${p.per} g protein/serving`:`~${p.per} g protein per batch`; }

/* ---------- prep checklist ---------- */
function prepTasks(){
  const tasks=[]; const dinners=S.plan.days.filter(d=>d.id).map(d=>({d,r:byId(d.id)})).filter(x=>x.r);
  const chop={}; dinners.forEach(({d,r})=>r.ingredients.forEach(x=>{ if(['yellow onions','bell peppers','carrots','celery','broccoli'].includes(x.key)&&!/frozen|baby/i.test(x.item)){ chop[x.key]=chop[x.key]||{n:0,uses:new Set()}; chop[x.key].n+=x.qty*dinnerFactor(r,d); chop[x.key].uses.add(r.name); } }));
  Object.entries(chop).forEach(([k,v])=>{ if(v.uses.size>=1) tasks.push({id:'chop:'+k,group:'Chop ahead',text:`Chop ${frac(Math.ceil(v.n))} ${k} for ${[...v.uses].join(', ')}. Store in containers or bags.`}); });
  const gb=dinners.filter(({r})=>r.ingredients.some(x=>x.key==='ground beef'));
  if(gb.length>=2&&!S.plan.prep.includes('prep-ground-beef')){ const lb=gb.reduce((s,{d,r})=>s+r.ingredients.filter(x=>x.key==='ground beef'&&x.unit==='lb').reduce((a,x)=>a+x.qty*dinnerFactor(r,d),0),0); tasks.push({id:'brown:gb',group:'Batch cook',text:`Brown ${frac(Math.round(lb*4)/4)} lb ground beef at once for ${gb.map(x=>x.r.name).join(', ')}. Season each portion the night you use it.`}); }
  S.plan.prep.forEach(id=>{ const r=byId(id); if(r) (r.steps||[]).forEach((s,i)=>tasks.push({id:id+':'+i,group:r.name,text:s,open:id})); });
  ['breakfast','lunch','snacks'].forEach(k=>(S.plan[k]||[]).forEach(id=>{ const r=byId(id); if(r&&r.night==='Prep Day') (r.steps||[]).forEach((s,i)=>tasks.push({id:id+':'+i,group:r.name,text:s,open:id})); }));
  return tasks;
}

/* ---------- cooking mode ---------- */
let timers=[], timerTick=null, wakeLock=null;
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); [0,0.35,0.7].forEach(t=>{ const o=a.createOscillator(), g=a.createGain(); o.frequency.value=880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(0.25,a.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+t+0.3); o.start(a.currentTime+t); o.stop(a.currentTime+t+0.3); }); }catch(e){} try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){} }
function drawTimers(){ const el=document.getElementById('cmTimers'); if(!el) return; const now=Date.now();
  el.innerHTML=timers.map((t,i)=>{ const left=Math.max(0,Math.round((t.end-now)/1000)); const done=left===0; return `<span class="chip ${done?'t':'m'}" style="font-size:14px;padding:6px 10px">${esc(t.label)} ${done?'done!':Math.floor(left/60)+':'+String(left%60).padStart(2,'0')} <button class="havebtn" data-tx="${i}" aria-label="Clear timer" style="color:inherit">×</button></span>`; }).join('');
  el.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>{ timers.splice(+b.dataset.tx,1); drawTimers(); }); }
function tick(){ const now=Date.now(); timers.forEach(t=>{ if(!t.rang&&t.end<=now){ t.rang=true; beep(); toast(t.label+' timer done'); } }); drawTimers(); if(!timers.length){ clearInterval(timerTick); timerTick=null; } }
function addTimer(label,mins){ timers.push({label,end:Date.now()+mins*60000}); if(!timerTick) timerTick=setInterval(tick,1000); drawTimers(); }
async function openCookMode(id,f){
  const r=byId(id); if(!r) return; f=f||1; let step=0; let showIng=false;
  let el=document.getElementById('cookmode'); if(!el){ el=document.createElement('div'); el.id='cookmode'; el.className='cookmode'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); document.body.appendChild(el); }
  try{ if(navigator.wakeLock) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){ wakeLock=null; }
  const steps=r.steps||[];
  const draw=()=>{ const s=steps[step]||''; const m=s.match(/(\d+(?:\.\d+)?)(?:\s*[–-]\s*(\d+(?:\.\d+)?))?\s*(min|minutes|hr|hours?)/i); const mins=m?(/^h/i.test(m[3])?parseFloat(m[1])*60:parseFloat(m[1])):null;
    el.innerHTML=`<div class="cm-head"><div><span class="eyebrow">Cooking mode</span><b>${esc(r.name)}</b></div><button class="iconbtn" id="cmX" aria-label="Close cooking mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div id="cmTimers" class="row" style="padding:0 16px"></div>
    <div class="cm-body"><span class="muted">Step ${step+1} of ${steps.length}</span><p class="cm-step">${esc(s)}</p>
    ${mins?`<button class="btn" id="cmT">Start ${mins>=60?frac(mins/60)+' hr':frac(mins)+' min'} timer</button>`:''}
    <button class="havebtn" id="cmI" style="margin-top:16px;font-size:15px">${showIng?'Hide':'Show'} ingredients</button>
    ${showIng?`<ul class="ing">${r.ingredients.map(x=>`<li><span class="q">${esc(qtyStr(COUNT_UNIT.test(x.unit)&&f===1?x.qty:roundQty(x.qty*f,x.unit),x.unit))}</span><span>${esc(x.item)}</span></li>`).join('')}</ul>`:''}
    ${step===steps.length-1?`<div class="note" style="background:var(--basil-soft)"><b>Kids' plate:</b> ${esc(kidsPlate(r))}</div>`:''}</div>
    <div class="cm-foot"><button class="btn" id="cmP" ${step===0?'disabled':''}>Back</button><button class="btn primary" id="cmN">${step===steps.length-1?'Done':'Next step'}</button></div>`;
    drawTimers();
    el.querySelector('#cmX').onclick=close; el.querySelector('#cmP').onclick=()=>{ if(step>0){step--;draw();} };
    el.querySelector('#cmN').onclick=()=>{ if(step<steps.length-1){step++;draw();} else close(); };
    el.querySelector('#cmI').onclick=()=>{showIng=!showIng;draw();};
    const tb=el.querySelector('#cmT'); if(tb) tb.onclick=()=>{ addTimer('Step '+(step+1),mins); toast('Timer started'); };
    el.querySelector('#cmN').focus(); };
  const close=()=>{ el.classList.remove('open'); try{wakeLock&&wakeLock.release();}catch(e){} wakeLock=null; };
  el.classList.add('open'); draw();
}

function normalize(s){

function parseQty(s){ s=(s||'').replace(/½/g,' 1/2').replace(/¼/g,' 1/4').replace(/¾/g,' 3/4').replace(/⅓/g,' 1/3').replace(/⅔/g,' 2/3').trim(); if(!s) return null; let t=0; s.split(/\s+/).forEach(p=>{ if(/^\d+\/\d+$/.test(p)){ const [a,b]=p.split('/'); t+=+a/+b; } else if(/^\d*\.?\d+$/.test(p)) t+=+p; }); return t||null; }
function parseIngLine(line){
  const m=line.trim().match(/^([\d\s\/.½¼¾⅓⅔]+)?\s*(lbs?|pounds?|oz|ounces?|cups?|c\.|tbsp|tablespoons?|tsp|teaspoons?|cans?|jars?|packets?|pkgs?|packages?|bags?|boxes?|cloves?|slices?|bunch(?:es)?|sticks?|heads?)?\.?\s*(?:of\s+)?(.*)$/i);
  const qty=parseQty(m&&m[1])||1; let unit=(m&&m[2]||'').toLowerCase(); const item=(m&&m[3]||line).trim();
  unit=unit.replace(/^pounds?$|^lbs$/,'lb').replace(/^ounces?$/,'oz').replace(/^cups$|^c\.$/,'cup').replace(/^tablespoons?$/,'tbsp').replace(/^teaspoons?$/,'tsp').replace(/s$/,'').replace(/^package$|^pkg$/,'pack').replace(/^boxe$/,'box').replace(/^bunche$/,'bunch').replace(/^clove$/,'cloves').replace(/^slice$/,'slices');
  const sec=(SEC_GUESS.find(([re])=>re.test(item))||[0,'Other'])[1];
  return {qty:Math.round(qty*100)/100,unit,item:item.slice(0,80),section:sec,pantry:PANTRY_GUESS.test(item)&&!/chicken|beef/i.test(item)};
}
function openTypeForm(prefill){
  openSheet('Type in a recipe',`<p class="muted" style="margin-top:0">Words only, no photos. One ingredient per line (like “2 lb chicken breasts”), one step per line.</p>
  <div class="stack" style="gap:10px">
  <label class="muted" for="fName" style="font-size:13px">Recipe name<input id="fName" class="search" style="margin:4px 0 0" maxlength="80" value="${esc(prefill||'')}"></label>
  <div class="settings"><label for="fCat">Category<select id="fCat">${CAT_ORDER.map(c=>`<option>${c}</option>`).join('')}</select></label>
  <label for="fServ">Servings<input id="fServ" type="number" min="1" max="30" value="4"></label></div>
  <label class="muted" for="fCook" style="font-size:13px">Cook time<input id="fCook" class="search" style="margin:4px 0 0" maxlength="60" placeholder="e.g. 30 min, or LOW 6 hr"></label>
  <label class="muted" for="fIng" style="font-size:13px">Ingredients<textarea id="fIng" style="min-height:130px" placeholder="2 lb chicken breasts&#10;1 can cream of chicken soup&#10;1 cup shredded cheddar"></textarea></label>
  <label class="muted" for="fSteps" style="font-size:13px">Steps<textarea id="fSteps" style="min-height:110px" placeholder="Put chicken in the Crockpot.&#10;Pour soup over it.&#10;Cook LOW 6 hr, shred, top with cheese."></textarea></label>
  <label class="muted" for="fNotes" style="font-size:13px">Tip for picky eaters (optional)<input id="fNotes" class="search" style="margin:4px 0 0" maxlength="500"></label>
  </div><div class="row" style="margin-top:12px"><button class="btn primary" id="fSave">Save recipe</button><span id="fMsg" class="miss"></span></div>`);
  document.getElementById('fSave').onclick=()=>{
    const g=id=>document.getElementById(id).value.trim(); const name=g('fName'); const ings=g('fIng').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,40); const steps=g('fSteps').split('\n').map(s=>s.replace(/^\d+[.)]\s*/,'').trim()).filter(Boolean).slice(0,25);
    if(name.length<2||!ings.length||!steps.length){ document.getElementById('fMsg').textContent='Add a name, at least one ingredient, and at least one step.'; return; }
    const r={id:'my-'+Date.now().toString(36),name,category:g('fCat'),night:g('fCat')==='Crockpot'?'Crockpot':'Easy',servings:Math.min(30,Math.max(1,+g('fServ')||4)),cook:g('fCook'),tags:[],ingredients:ings.map(parseIngLine),steps,notes:g('fNotes'),source:'Added by you'};
    S.custom.push(r); persist(); toast('Recipe saved'); openRecipe(r.id);
  };
}

/* ---------- boot ---------- */
S=normalize(S); onClaude=!!(window.claude&&window.claude.use); if(sbOn()) setTimeout(sbLoad,300);
function weeklyCheck(){ const wk=weekKey();
  if(S.viewing==='next') switchWeek('this',true);
  if(!S.weekOf){ S.weekOf=wk; return; }
  if(S.weekOf!==wk){
    const o=S.otherWeek;
    if(S.weekOf===nextWeekKey()) return;
    if(o&&o.weekOf===wk){ applyBundle(o); S.otherWeek=null; S.viewing='this'; S.newWeekBanner=true; persist(); return; }
    if(o&&o.weekOf&&o.weekOf<wk) S.otherWeek=null;
    if(S.autoWeek!==false){ autoPlan(true); S.newWeekBanner=true; persist(); }
  }
  if(S.otherWeek&&S.otherWeek.weekOf&&S.otherWeek.weekOf<wk) S.otherWeek=null; }
if(!S.plan.days.some(d=>d.id)) autoPlan(true); else weeklyCheck(); render();
(async()=>{
  try{ if(!window.claude||!window.claude.use) return;
    const [d,u,s]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('sample')]);
    sampleFn=s||null; userNs=u||null;
    if(d&&u){ db=d; userId=await u.id(); }
    if(db&&userId){
      let loaded=false; const timer=setTimeout(()=>{ if(!loaded) setSync('Saved on this device'); },10000);
      try{ const doc=await db.collection('data/users/'+userId).doc('state').get(); loaded=true; clearTimeout(timer);
        const data=doc&&(typeof doc.data==='function'?doc.data():doc); const exists=doc&&(doc.exists===undefined?!!data:doc.exists);
        dbReady=true;
        if(exists&&data&&data.json){ S=normalize(Object.assign(fresh(),JSON.parse(data.json))); try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} }
        else { persist(); }
        if(S.family){ try{ const fs=await db.doc('households/'+S.family).get(); if(fs.exists){ const fd=fs.data(); const code=S.family; S=normalize(Object.assign(fresh(),JSON.parse(fd.json))); S.family=code; lastFamT=fd.t; } listenFamily(S.family); }catch(e){} }
        weeklyCheck();
        setSync('Synced to your account');
      }catch(e){ clearTimeout(timer); }
      loadShared();
    }
    render();
  }catch(e){ render(); }
})();
})();
